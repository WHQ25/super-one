# Dependency policy, in three tiers that are handled by three different things.
#
#   security  — Dependabot alerts AND automated security PRs, both on in the
#               repository's Security settings, neither driven by this file.
#               Expect the PR itself to be unmergeable for anything outside the
#               root bun workspace: that track detects apps/web as npm_and_yarn
#               and edits package.json without bun.lock, so it cannot pass
#               `bun install --frozen-lockfile` (see #36). Read it for the
#               advisory list and fixed version, then apply the bump by hand.
#   minor/patch — this file. One grouped PR per ecosystem per month.
#   major     — raised by hand, when there is a reason to. Never below.
#
# Majors are ignored rather than merely grouped because a bot PR is the worst
# place to judge one: the ones that matter here (vitest 5 across ~800 test
# files, dockview 5 -> 8) need scheduling, and the ones that do not still cost a
# review each. Nothing stops a manual bump; `bun outdated --filter '*'` lists
# what is behind.
version: 2
updates:
  # Keep the SHA-pinned actions in .github/workflows current. Dependabot
  # rewrites the pin and the trailing version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # Action majors are read and raised by hand. CI cannot judge them anyway:
      # ci.yml is the only workflow with a `pull_request` trigger, so a PR that
      # changes build-*.yml or promote.yml gets a green tick from checks that
      # never ran it. upload-artifact and download-artifact must also agree on a
      # version, and Dependabot splits them into separate PRs.
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
      # Pinned to vite 7 / Rollup on purpose; scripts/check-deps-lock.mjs
      # explains why and fails the build if either moves.
      - dependency-name: vite
      - dependency-name: rolldown
      # The entries below are majors, so the blanket rule already covers them.
      # They are kept because they record WHY, and they keep protecting if that
      # rule is ever relaxed. zod is the exception that needs its own rule: its
      # break arrived in a minor.
      #
      # zod 4.5 changed the internal type shape @modelcontextprotocol/sdk types
      # its tool inputs against: `Record<string, ZodTypeAny>` stops assigning to
      # the SDK's `ZodRawShapeCompat`, and the JSON Schema it emits drifts, so
      # every MCP tool definition fails typecheck and the descriptor tests. The
      # SDK is already on its latest (1.30.0) — there is no version to upgrade
      # into. Drop this once the SDK supports zod 4.5; 4.4.x patches still flow.
      - dependency-name: zod
        versions: [">=4.5.0"]
      # @types/node describes a runtime, so it must not run ahead of one. The
      # desktop app runs Electron 44's bundled Node 24.19.0 and the release
      # workflows pin Node 22; types from 25+ would let code type check against
      # APIs that exist in neither. Raise this in step with the Electron bump.
      - dependency-name: "@types/node"
        versions: [">=25"]
      # eslint 10 changes the rule context API, and eslint-plugin-react 7.37.5 —
      # pulled in by eslint-config-next, so not directly removable — still
      # declares `eslint: ... || ^9.7` and crashes on it with
      # `contextOrFilename.getFilename is not a function`. Lift once
      # eslint-plugin-react ships an eslint 10 peer range.
      - dependency-name: eslint
        versions: [">=10"]
