version: 2
updates:
  # Keep the SHA-pinned actions in .github/workflows current. Dependabot
  # rewrites the pin and the trailing version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # Minor and patch bumps arrive as one PR. A major bump of an action that
      # a release depends on (upload/download-artifact must agree on a
      # version) arrives on its own so it gets read before it is merged.
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned to vite 7 / Rollup on purpose; scripts/check-deps-lock.mjs
      # explains why and fails the build if either moves.
      - dependency-name: vite
      - dependency-name: rolldown
