name: Build macOS

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or commit SHA to build'
        required: false
        default: 'main'
      variant:
        description: 'Which side-by-side app to build'
        required: true
        type: choice
        options:
          - alpha
          - stable
      version:
        description: 'Override the BASE version, e.g. cutting a release from an older commit. Plain release number — the variant appends its own -alpha. Blank = package.json.'
        required: false
  workflow_call:
    inputs:
      ref:
        description: Branch or commit SHA to build
        required: false
        type: string
        default: main
      variant:
        description: Which side-by-side app to build
        required: true
        type: string
      version:
        description: Override the BASE version, e.g. cutting a release from an older commit. Plain release number — the variant appends its own -alpha. Blank = package.json.
        required: false
        type: string

concurrency:
  group: build-mac-${{ inputs.variant }}-${{ inputs.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SO_CF_RELAY_URL: ${{ secrets.SO_CF_RELAY_URL }}
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile --concurrent-scripts=1
      - run: bun run check-deps-lock
      - run: bun run build:mac -- --x64 --arm64 --publish never
        env:
          SUPERONE_VARIANT: ${{ inputs.variant }}
          SUPERONE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
      # Signed SLSA provenance for every installer, verifiable with
      # `gh attestation verify <file> --repo WHQ25/super-one`.
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            apps/desktop/dist/${{ inputs.variant }}/*.dmg
            apps/desktop/dist/${{ inputs.variant }}/*.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-mac
          path: |
            apps/desktop/dist/${{ inputs.variant }}/*.dmg
            apps/desktop/dist/${{ inputs.variant }}/*.zip
            apps/desktop/dist/${{ inputs.variant }}/*.blockmap
            apps/desktop/dist/${{ inputs.variant }}/*-mac.yml
          retention-days: 7
          if-no-files-found: error
