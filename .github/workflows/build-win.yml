name: Build Windows

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or commit SHA to build'
        required: false
        default: 'main'
      variant:
        description: 'Which side-by-side app to build'
        required: true
        type: choice
        options:
          - alpha
          - stable
      version:
        description: 'Override the BASE version, e.g. cutting a release from an older commit. Plain release number — the variant appends its own -alpha. Blank = package.json.'
        required: false
  workflow_call:
    inputs:
      ref:
        description: Branch or commit SHA to build
        required: false
        type: string
        default: main
      variant:
        description: Which side-by-side app to build
        required: true
        type: string
      version:
        description: Override the BASE version, e.g. cutting a release from an older commit. Plain release number — the variant appends its own -alpha. Blank = package.json.
        required: false
        type: string

concurrency:
  group: build-win-${{ inputs.variant }}-${{ inputs.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SO_CF_RELAY_URL: ${{ secrets.SO_CF_RELAY_URL }}
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile --concurrent-scripts=1
      - run: bun run check-deps-lock
      - run: bun run build:win -- --publish never
        env:
          SUPERONE_VARIANT: ${{ inputs.variant }}
          SUPERONE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
      # Signed SLSA provenance for every installer, verifiable with
      # `gh attestation verify <file> --repo WHQ25/super-one`.
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            apps/desktop/dist/${{ inputs.variant }}/*.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-win
          path: |
            apps/desktop/dist/${{ inputs.variant }}/*.exe
            apps/desktop/dist/${{ inputs.variant }}/*.blockmap
            apps/desktop/dist/${{ inputs.variant }}/*.yml
          retention-days: 7
          if-no-files-found: error
