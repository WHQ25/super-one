name: Build Windows

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or commit SHA to build'
        required: false
        default: 'main'
      variant:
        description: 'Which side-by-side app to build'
        required: true
        type: choice
        options:
          - alpha
          - stable
      version:
        description: 'Override the packaged version (e.g. cutting stable from an alpha commit). Blank = package.json.'
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SO_CF_RELAY_URL: ${{ secrets.SO_CF_RELAY_URL }}
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile --concurrent-scripts=1
      - run: bun run check-deps-lock
      - run: bun run build:win -- --publish never
        env:
          SUPERONE_VARIANT: ${{ inputs.variant }}
          SUPERONE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-win
          path: |
            apps/desktop/dist/${{ inputs.variant }}/*.exe
            apps/desktop/dist/${{ inputs.variant }}/*.blockmap
            apps/desktop/dist/${{ inputs.variant }}/*.yml
          retention-days: 1
          if-no-files-found: error
