name: Deploy relay

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Which relay to deploy: alpha (relay-alpha.super-one.dev) or stable (relay.super-one.dev)'
        required: true
        type: choice
        options:
          - alpha
          - stable
      ref:
        description: 'Branch or commit SHA to deploy (defaults to main HEAD)'
        required: false
        default: 'main'
      message:
        description: 'Deploy message shown in Cloudflare dashboard history'
        required: false
  workflow_call:
    inputs:
      channel:
        description: Which relay to deploy, alpha or stable (the release variant)
        required: true
        type: string
      ref:
        description: Branch or commit SHA to deploy (defaults to main HEAD)
        required: false
        type: string
        default: main
      message:
        description: Deploy message shown in Cloudflare dashboard history
        required: false
        type: string

concurrency:
  group: deploy-relay-${{ inputs.channel }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  INPUT_MESSAGE: ${{ inputs.message }}
  INPUT_CHANNEL: ${{ inputs.channel }}
  # Alpha builds point at their own Worker, so relay changes reach alpha
  # clients before stable ones. Same code and wrangler.toml; only the Worker
  # name and domain differ.
  WORKER_NAME: ${{ inputs.channel == 'alpha' && 'super-one-relay-alpha' || 'super-one-relay' }}
  RELAY_DOMAIN: ${{ inputs.channel == 'alpha' && 'relay-alpha.super-one.dev' || 'relay.super-one.dev' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check channel
        run: |
          case "$INPUT_CHANNEL" in
            alpha|stable) ;;
            *) echo "::error::unknown relay channel '$INPUT_CHANNEL'"; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Relay unit tests
        run: bun run test:relay

      - name: Inject official custom domain
        working-directory: apps/relay
        run: |
          cat > /tmp/route.toml <<EOF
          # Prepended by deploy-relay.yml for the official deployments only.
          # Not committed — keeps wrangler.toml self-host friendly in the public mirror.
          routes = [
            { pattern = "${RELAY_DOMAIN}", custom_domain = true },
          ]

          EOF
          cat /tmp/route.toml wrangler.toml > wrangler.toml.new
          mv wrangler.toml.new wrangler.toml
          echo "--- wrangler.toml after injection ---"
          cat wrangler.toml

      - name: Deploy via wrangler
        working-directory: apps/relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not set. Create a fine-grained CF API token with Account: Workers Scripts:Edit + Account:Read + Workers R2 Storage:Read, plus Zone: DNS:Edit + Zone: Workers Routes:Edit on the super-one.dev zone (needed for the relay.super-one.dev custom domain). Add it as a repo secret."
            exit 1
          fi
          if [ -n "${INPUT_MESSAGE}" ]; then
            bunx wrangler deploy --name "${WORKER_NAME}" --message "${INPUT_MESSAGE}"
          else
            bunx wrangler deploy --name "${WORKER_NAME}" --message "deploy via gh actions: ${{ github.sha }}"
          fi

      # File presign credentials live in repo secrets, so every Worker this
      # workflow deploys gets them without a by-hand `wrangler secret put`.
      # The key is scoped to the staging bucket only: it must not be the
      # release R2 key, which can rewrite update artifacts.
      - name: Sync file presign secrets
        working-directory: apps/relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.RELAY_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.RELAY_R2_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ]; then
            echo "::error::Set repo secrets RELAY_R2_ACCESS_KEY_ID and RELAY_R2_SECRET_ACCESS_KEY (an R2 API token with Object Read & Write on super-one-file-staging only) and R2_ACCOUNT_ID."
            exit 1
          fi
          SECRETS_FILE="$RUNNER_TEMP/relay-secrets.json"
          jq -n --arg bucket super-one-file-staging \
            '{R2_ACCOUNT_ID: env.R2_ACCOUNT_ID, R2_BUCKET_NAME: $bucket, R2_ACCESS_KEY_ID: env.R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY: env.R2_SECRET_ACCESS_KEY}' \
            > "$SECRETS_FILE"
          bunx wrangler secret bulk "$SECRETS_FILE" --name "${WORKER_NAME}"
          rm -f "$SECRETS_FILE"
