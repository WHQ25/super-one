name: Deploy relay

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or commit SHA to deploy (defaults to main HEAD)'
        required: false
        default: 'main'
      message:
        description: 'Deploy message shown in Cloudflare dashboard history'
        required: false
  workflow_call:
    inputs:
      ref:
        description: Branch or commit SHA to deploy (defaults to main HEAD)
        required: false
        type: string
        default: main
      message:
        description: Deploy message shown in Cloudflare dashboard history
        required: false
        type: string

concurrency:
  group: deploy-relay
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  INPUT_MESSAGE: ${{ inputs.message }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Relay unit tests
        run: bun run test:relay

      - name: Inject official custom domain
        working-directory: apps/relay
        run: |
          cat > /tmp/route.toml <<'EOF'
          # Prepended by deploy-relay.yml for the official deployment only.
          # Not committed — keeps wrangler.toml self-host friendly in the public mirror.
          routes = [
            { pattern = "relay.super-one.dev", custom_domain = true },
          ]

          EOF
          cat /tmp/route.toml wrangler.toml > wrangler.toml.new
          mv wrangler.toml.new wrangler.toml
          echo "--- wrangler.toml after injection ---"
          cat wrangler.toml

      - name: Deploy via wrangler
        working-directory: apps/relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not set. Create a fine-grained CF API token with Account: Workers Scripts:Edit + Account:Read, plus Zone: DNS:Edit + Zone: Workers Routes:Edit on the super-one.dev zone (needed for the relay.super-one.dev custom domain). Add it as a repo secret."
            exit 1
          fi
          if [ -n "${INPUT_MESSAGE}" ]; then
            bunx wrangler deploy --message "${INPUT_MESSAGE}"
          else
            bunx wrangler deploy --message "deploy via gh actions: ${{ github.sha }}"
          fi
