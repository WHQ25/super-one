name: Promote to Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v0.21.5-alpha)'
        required: true
      variant:
        description: 'Which side-by-side app these artifacts belong to'
        required: true
        type: choice
        options:
          - alpha
          - stable
      target_sha:
        description: 'Commit SHA to tag when released (defaults to main HEAD)'
        required: false
      mac_run_id:
        description: 'Build macOS run ID (leave blank to skip)'
        required: false
      win_run_id:
        description: 'Build Windows run ID (leave blank to skip)'
        required: false
      linux_run_id:
        description: 'Build Linux run ID (leave blank to skip)'
        required: false
  workflow_call:
    inputs:
      release_tag:
        description: Release tag (e.g. v0.21.5-alpha)
        required: true
        type: string
      variant:
        description: Which side-by-side app these artifacts belong to
        required: true
        type: string
      target_sha:
        description: Commit SHA to tag when released (defaults to main HEAD)
        required: false
        type: string
      mac_run_id:
        description: Build macOS run ID (leave blank to skip)
        required: false
        type: string
      win_run_id:
        description: Build Windows run ID (leave blank to skip)
        required: false
        type: string
      linux_run_id:
        description: Build Linux run ID (leave blank to skip)
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  INPUT_LINUX_RUN_ID: ${{ inputs.linux_run_id }}
  INPUT_MAC_RUN_ID: ${{ inputs.mac_run_id }}
  INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
  INPUT_TARGET_SHA: ${{ inputs.target_sha }}
  INPUT_VARIANT: ${{ inputs.variant }}
  INPUT_WIN_RUN_ID: ${{ inputs.win_run_id }}

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write  # write needed to delete artifacts after promote
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Download macOS artifact
        if: ${{ inputs.mac_run_id != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: staging
          name: dist-mac
          run-id: ${{ inputs.mac_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Windows artifact
        if: ${{ inputs.win_run_id != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: staging
          name: dist-win
          run-id: ${{ inputs.win_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Linux artifact
        if: ${{ inputs.linux_run_id != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: staging
          name: dist-linux
          run-id: ${{ inputs.linux_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: List staging contents
        run: |
          if [ ! -d staging ]; then
            echo "::error::No artifacts downloaded — at least one of mac_run_id / win_run_id / linux_run_id is required"
            exit 1
          fi
          ls -la staging/

      - name: Resolve target SHA
        id: sha
        run: |
          if [ -n "${INPUT_TARGET_SHA}" ]; then
            echo "sha=${INPUT_TARGET_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          TAG="${INPUT_RELEASE_TAG}"
          VERSION="${TAG#v}"
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE_FLAG=(--prerelease)
            echo "Detected prerelease ($VERSION) — will mark release as prerelease"
          else
            PRERELEASE_FLAG=()
            echo "Detected stable release ($VERSION) — release will not be marked prerelease"
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists — uploading artifacts (--clobber)"
            gh release upload "$TAG" staging/* --clobber
          else
            echo "Creating new draft release $TAG at ${TARGET_SHA}"
            gh release create "$TAG" \
              --draft \
              "${PRERELEASE_FLAG[@]}" \
              --target "${TARGET_SHA}" \
              --title "$TAG" \
              --notes "Draft — see CHANGELOG.md" \
              staging/*
          fi

      - name: Show release summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Release: ${INPUT_RELEASE_TAG}"
          gh release view "${INPUT_RELEASE_TAG}" --json url,isDraft,isPrerelease -q '.url, .isDraft, .isPrerelease'
          echo "Assets:"
          gh release view "${INPUT_RELEASE_TAG}" --json assets -q '.assets[].name'

      - name: Restructure staging for R2 (binaries → variant/version subdir; drop channel ymls)
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          VARIANT: ${{ inputs.variant }}
        run: |
          set -euo pipefail
          # Each variant owns its own prefix on R2. Its app-update.yml points at
          # https://dl.super-one.dev/<variant>, so the manifest's relative
          # v<version>/ paths resolve inside that prefix.
          PREFIX="${RELEASE_TAG#v}"
          PREFIX="${VARIANT}/v${PREFIX}"
          echo "Archiving binaries under prefix: ${PREFIX}/"

          mkdir -p "staging/${PREFIX}"
          shopt -s nullglob
          for f in staging/*.dmg staging/*.zip staging/*.exe staging/*.AppImage staging/*.blockmap; do
            mv "$f" "staging/${PREFIX}/"
          done

          # Channel ymls stay only on the GitHub Release (flat); they are NOT
          # written to R2 here. Making a version the channel's "latest" on R2 is
          # the job of the separate `set-latest` workflow.
          rm -f staging/*.yml

          echo "--- Final R2 layout (binaries only) ---"
          find staging -type f | sort

      - name: Sync release binaries to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 sync staging/ s3://super-one-releases/ \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --no-progress
          echo "Archived to https://dl.super-one.dev/${INPUT_VARIANT}/ (run set-latest to publish it)"

      - name: Delete consumed CI artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          cleanup_run_artifacts() {
            local run_id=$1
            [ -z "$run_id" ] && return
            echo "Cleaning artifacts from run $run_id"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" \
              --jq '.artifacts[] | "\(.id) \(.name) \(.size_in_bytes)"' \
              | while read -r artifact_id artifact_name artifact_size; do
                echo "  deleting $artifact_name ($artifact_id, $artifact_size bytes)"
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" || \
                  echo "  (delete failed for $artifact_id — continuing)"
              done
          }
          cleanup_run_artifacts "${INPUT_MAC_RUN_ID}"
          cleanup_run_artifacts "${INPUT_WIN_RUN_ID}"
          cleanup_run_artifacts "${INPUT_LINUX_RUN_ID}"
