name: Prune Archived Releases

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Which app to prune'
        required: true
        type: choice
        options:
          - alpha
          - stable
      mode:
        description: 'single = just this version | older-than = everything below it'
        required: true
        type: choice
        options:
          - single
          - older-than
      version:
        description: 'Version (e.g. 0.61.0-alpha). For older-than this is the exclusive boundary and is kept.'
        required: true
      dry_run:
        description: 'Report what would be deleted without deleting it'
        required: false
        type: boolean
        default: true
      delete_github_release:
        description: 'Also delete the GitHub Release. This removes set-latest rollback for that version.'
        required: false
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  INPUT_DRY_RUN: ${{ inputs.dry_run }}
  INPUT_MODE: ${{ inputs.mode }}
  INPUT_VARIANT: ${{ inputs.variant }}
  INPUT_VERSION: ${{ inputs.version }}

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Read the versions this variant currently publishes
        id: live
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          LIVE=""

          # Read the BUCKET, not dl.super-one.dev. A transient failure must not
          # look like "nothing is published" -- that would silently drop the
          # guard and let the run delete the version clients are downloading
          # right now -- so only a definitively absent key counts as absent and
          # anything else fails the job. The public URL cannot support that
          # distinction: it answers a missing object with 403 for a runner and
          # 404 for a browser, so "absent" was unreachable from CI and this step
          # failed on every variant that has no pointer yet. s3api separates the
          # two (404/NoSuchKey vs 403/AccessDenied) and reads through no cache.
          fetch_manifest() { # key, outfile -> 0 found, 1 absent, 2 unknown
            local err
            if err="$(aws s3api get-object --bucket super-one-releases \
                        --key "$1" --endpoint-url "$ENDPOINT" "$2" 2>&1 >/dev/null)"; then
              return 0
            fi
            case "$err" in
              *"(404)"*|*NoSuchKey*|*"Not Found"*) return 1 ;;
              *) echo "::error::s3://super-one-releases/$1: ${err}"; return 2 ;;
            esac
          }

          for yml in latest-mac.yml latest.yml latest-linux.yml; do
            key="${INPUT_VARIANT}/${yml}"
            set +e; fetch_manifest "$key" "${yml}.body"; rc=$?; set -e
            case "$rc" in
              0)
                v="$(sed -n 's/^version:[[:space:]]*//p' "${yml}.body" | tr -d "'\"" | head -1)"
                if [ -z "$v" ]; then
                  echo "::error::${key} fetched but has no version field"; exit 1
                fi
                echo "${key} -> ${v}"
                LIVE="${LIVE:+$LIVE,}$v"
                ;;
              1) echo "${key} -> (not published yet)" ;;
              *) echo "::error::refusing to prune without knowing what is live"; exit 1 ;;
            esac
          done

          # The pre-variant root manifests also name a live version. After a
          # set-latest with legacy_root they point INTO this bucket -- e.g.
          # alpha-mac.yml serving stable/v0.61.0/ -- so a version can be the
          # one legacy clients are downloading right now while no
          # <variant>/latest-*.yml names it any more. Pruning it 404s them.
          # Only count a root manifest whose paths are under THIS variant.
          for yml in alpha-mac.yml alpha.yml alpha-linux.yml beta-mac.yml beta.yml beta-linux.yml latest-mac.yml latest.yml latest-linux.yml; do
            set +e; fetch_manifest "$yml" "root-${yml}.body"; rc=$?; set -e
            case "$rc" in
              0) ;;
              1) continue ;;
              *) echo "::error::refusing to prune without knowing what is live"; exit 1 ;;
            esac
            p="$(sed -n 's/^path:[[:space:]]*//p' "root-${yml}.body" | tr -d "'\"" | head -1)"
            case "$p" in
              "${INPUT_VARIANT}/"*) ;;
              *) echo "root/${yml} -> ${p:-(no path)} — not this variant, ignoring"; continue ;;
            esac
            v="$(sed -n 's/^version:[[:space:]]*//p' "root-${yml}.body" | tr -d "'\"" | head -1)"
            if [ -z "$v" ]; then
              echo "::error::root/${yml} fetched but has no version field"; exit 1
            fi
            echo "root/${yml} -> ${v} (legacy bridge into ${INPUT_VARIANT}/)"
            LIVE="${LIVE:+$LIVE,}$v"
          done

          echo "versions=${LIVE}" >> "$GITHUB_OUTPUT"

      - name: List archived objects
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          # s3api rather than `s3 ls`: installer names contain spaces
          # ("SuperOne Setup.exe"), so column-splitting the ls output truncates
          # keys. --output json + jq keeps them intact, and the CLI paginates.
          aws s3api list-objects-v2 \
            --bucket super-one-releases \
            --prefix "${INPUT_VARIANT}/" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --query 'Contents[].Key' --output json | jq -r '.[]? // empty' > keys.txt
          echo "$(wc -l < keys.txt) objects under ${INPUT_VARIANT}/"

      - name: Compute the prune plan
        env:
          LIVE_VERSIONS: ${{ steps.live.outputs.versions }}
        run: |
          set -euo pipefail
          bun scripts/prune-releases.ts \
            "${INPUT_MODE}" \
            "${INPUT_VERSION}" \
            "${INPUT_VARIANT}" \
            keys.txt \
            "${LIVE_VERSIONS}" \
            prune-plan.json | tee plan.log

      - name: Summarise
        env:
          LIVE_VERSIONS: ${{ steps.live.outputs.versions }}
        run: |
          {
            echo "### Prune ${INPUT_VARIANT} — ${INPUT_MODE} \`${INPUT_VERSION}\`"
            echo
            echo "Currently published: \`${LIVE_VERSIONS}\`"
            echo
            echo '```'
            cat plan.log
            echo '```'
            if [ "${INPUT_DRY_RUN}" = "true" ]; then
              echo
              echo '**Dry run — nothing was deleted.** Re-run with `dry_run=false` to apply.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete the binaries from R2
        if: ${{ inputs.dry_run == false }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          jq -r '.remove[]' prune-plan.json | while read -r v; do
            echo "removing ${INPUT_VARIANT}/v${v}/"
            aws s3 rm "s3://super-one-releases/${INPUT_VARIANT}/v${v}/" \
              --recursive --endpoint-url "$ENDPOINT" --no-progress
          done

      - name: Delete the GitHub Releases
        if: ${{ inputs.dry_run == false && inputs.delete_github_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The Release is set-latest's manifest source and its R2 backfill
          # source, so this is what makes a version unrecoverable. The tag is
          # left in place; it costs nothing and keeps the history readable.
          jq -r '.remove[]' prune-plan.json | while read -r v; do
            if gh release view "v${v}" >/dev/null 2>&1; then
              echo "deleting release v${v}"
              gh release delete "v${v}" --yes
            else
              echo "no release v${v}"
            fi
          done
