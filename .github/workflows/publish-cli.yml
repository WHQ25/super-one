name: Publish CLI to npm

# Builds a publishable `@super-one/cli` package (bundled monorepo code + npm
# deps for natives/SDK) and publishes to the public registry.
#
# Design: docs/design/remote-node-service.md §15.4
#
# Triggers:
# - workflow_dispatch: manual / release skill lockstep
# - Not on every PR. Prefer calling after a desktop version bump so the CLI
#   version matches the SuperOne app (registry install pins by app version).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (default: root package.json version)'
        required: false
        default: ''
      tag:
        description: 'npm dist-tag (alpha | latest). Empty = derive from version.'
        required: false
        default: ''
      dry_run:
        description: 'If true, pack only (npm pack); do not publish'
        type: boolean
        required: false
        default: false
      ref:
        description: 'Branch or commit SHA to build'
        required: false
        default: 'main'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  INPUT_DRY_RUN: ${{ inputs.dry_run }}
  INPUT_TAG: ${{ inputs.tag }}
  INPUT_VERSION: ${{ inputs.version }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted Publishing (OIDC) when configured on npm for @super-one/cli
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          # Keep Node 22 for tests/pack; Trusted Publishing upgrades npm below.
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile --concurrent-scripts=1

      - name: Resolve version and dist-tag
        id: meta
        run: |
          set -euo pipefail
          ROOT_VER=$(node -p "require('./package.json').version")
          VER="${INPUT_VERSION}"
          if [ -z "$VER" ]; then VER="$ROOT_VER"; fi
          TAG="${INPUT_TAG}"
          if [ -z "$TAG" ]; then
            case "$VER" in
              *-alpha*|*-alpha.*) TAG=alpha ;;
              *) TAG=latest ;;
            esac
          fi
          # Pre-release must never land on latest.
          case "$VER" in
            *-alpha*|*-beta*|*-rc*)
              if [ "$TAG" = "latest" ]; then
                echo "::error::refusing pre-release $VER with dist-tag latest"
                exit 1
              fi
              ;;
          esac
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing plan: @super-one/cli@$VER (tag $TAG) dry_run=${INPUT_DRY_RUN}"

      - name: CLI unit tests
        run: bun run test:cli

      - name: Pack npm package
        run: |
          set -euo pipefail
          bun --filter @superone/cli pack:npm -- --version "${VER}"
          test -f apps/cli/dist/npm/package.json
          test -f apps/cli/dist/npm/lib/cli.mjs
          test -f apps/cli/dist/npm/bin/superone.mjs
          node -e "
            const p = require('./apps/cli/dist/npm/package.json');
            if (p.name !== '@super-one/cli') throw new Error('bad name ' + p.name);
            if (p.version !== process.env.VER) throw new Error('bad version ' + p.version);
            console.log('pack ok', p.name, p.version);
          "
        env:
          VER: ${{ steps.meta.outputs.version }}

      - name: Smoke bin (install natives + usage/identity)
        run: |
          set -euo pipefail
          cd apps/cli/dist/npm
          # Install declared deps so better-sqlite3 / node-pty / SDK resolve on the runner.
          npm install --omit=dev --no-fund --no-audit
          # No args → usage (exit 1).
          set +e
          node bin/superone.mjs > /tmp/superone-usage.txt 2>&1
          set -e
          grep -q 'start' /tmp/superone-usage.txt
          grep -q 'pair-create' /tmp/superone-usage.txt
          grep -q 'install-systemd' /tmp/superone-usage.txt
          HOME_TMP=$(mktemp -d)
          node bin/superone.mjs identity --home "$HOME_TMP" | tee /tmp/superone-id.txt
          grep -q environmentId /tmp/superone-id.txt

      - name: Dry-run npm pack
        if: ${{ inputs.dry_run }}
        working-directory: apps/cli/dist/npm
        run: npm pack --dry-run

      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        working-directory: apps/cli/dist/npm
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          # Trusted Publishing needs npm ≥11.5.1. Node 22 ships npm 10, which
          # signs provenance then fails the package PUT with a misleading E404.
          npm install -g npm@^11.5.1
          npm --version
          # Do NOT export an empty NODE_AUTH_TOKEN — setup-node may write a
          # blank //registry.npmjs.org/:_authToken= line that breaks OIDC.
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            echo "Using NPM_TOKEN for npm publish"
            export NODE_AUTH_TOKEN="${{ secrets.NPM_TOKEN }}"
            npm publish --access public --tag "$TAG"
          else
            echo "Using npm Trusted Publishing (OIDC + provenance)"
            # Clear any empty auth from setup-node so OIDC can run.
            if [ -f "$NPM_CONFIG_USERCONFIG" ]; then
              sed -i '/_authToken=\s*$/d' "$NPM_CONFIG_USERCONFIG" || true
              sed -i '/_authToken=$/d' "$NPM_CONFIG_USERCONFIG" || true
            fi
            npm publish --access public --tag "$TAG" --provenance
          fi

      - name: Upload pack artifact
        uses: actions/upload-artifact@v4
        with:
          name: super-one-cli-npm-${{ steps.meta.outputs.version }}
          path: apps/cli/dist/npm
          retention-days: 14
