name: Publish Harness Artifacts

# Pack pinned Claude/Codex npm tarballs, compute SHA-256, upload byte-exact
# mirrors to R2, and publish harness/manifest/<channel>.json.
#
# Pins are read from @superone/runtime source constants (never free-form input)
# so the manifest cannot drift from the code (design §4 / P3).

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Harness manifest channel to publish'
        required: true
        type: choice
        options:
          - alpha
          - beta
          - stable
        default: alpha
      dry_run:
        description: 'Stage only — do not upload to R2'
        required: false
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install (no native rebuild needed for pack)
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Pack artifacts + write channel manifest
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          ARGS=(--channel "${{ inputs.channel }}" --out staging-harness)
          if [ "${{ inputs.dry_run }}" != "true" ]; then
            ARGS+=(--upload)
          fi
          bun scripts/publish-harness-artifacts.ts "${ARGS[@]}"
          echo "--- staged tree ---"
          find staging-harness -type f | sort
          echo "--- manifest (truncated) ---"
          head -c 4000 "staging-harness/harness/manifest/${{ inputs.channel }}.json" || true
          echo

      - name: Upload staged tree (debug artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-${{ inputs.channel }}
          path: staging-harness
          if-no-files-found: warn
          retention-days: 14
