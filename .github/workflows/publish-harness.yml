name: Publish Harness Artifacts

# Pack pinned Claude/Codex npm tarballs, compute SHA-256, upload byte-exact
# mirrors to R2, and publish:
#   - harness/manifest/<channel>.json
#   - app/harness-pins/<appVersion>.json  (desktop update pre-fetch)
#
# Pins are read from @superone/runtime source constants (never free-form package
# versions) so the manifest cannot drift from the code (design §4 / P3).
# App-version pins default to root package.json version (the desktop release).

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Which app variant to publish harness runtimes for'
        required: true
        type: choice
        options:
          - alpha
          - stable
        default: alpha
      app_version:
        description: 'Override app/harness-pins/<version>.json key. Default is derived: root package.json base + the channel variant prerelease tag (alpha -> X.Y.Z-alpha, stable -> X.Y.Z). Only needed when cutting from a commit whose base differs.'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Stage only — do not upload to R2'
        required: false
        type: boolean
        default: false
      ref:
        description: 'Branch or commit SHA to read pins from'
        required: false
        default: 'main'
  workflow_call:
    inputs:
      channel:
        description: Which app variant to publish harness runtimes for
        required: true
        type: string
        default: alpha
      app_version:
        description: >-
          Override app/harness-pins/<version>.json key. Default is derived: root package.json base + the channel variant prerelease tag (alpha -> X.Y.Z-alpha, stable -> X.Y.Z). Only needed when cutting
          from a commit whose base differs.
        required: false
        type: string
        default: ''
      dry_run:
        description: Stage only — do not upload to R2
        required: false
        type: boolean
        default: false
      ref:
        description: Branch or commit SHA to read pins from
        required: false
        default: main
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  INPUT_APP_VERSION: ${{ inputs.app_version }}
  INPUT_CHANNEL: ${{ inputs.channel }}
  INPUT_DRY_RUN: ${{ inputs.dry_run }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install (no native rebuild needed for pack)
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Pack artifacts + write channel manifest + app pins
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          ARGS=(--channel "${INPUT_CHANNEL}" --out staging-harness)
          if [ -n "${INPUT_APP_VERSION}" ]; then
            ARGS+=(--app-version "${INPUT_APP_VERSION}")
          fi
          if [ "${INPUT_DRY_RUN}" != "true" ]; then
            ARGS+=(--upload)
          fi
          bun scripts/publish-harness-artifacts.ts "${ARGS[@]}"
          echo "--- staged tree ---"
          find staging-harness -type f | sort
          echo "--- channel manifest (truncated) ---"
          head -c 4000 "staging-harness/harness/manifest/${INPUT_CHANNEL}.json" || true
          echo
          echo "--- app harness pins ---"
          find staging-harness/app/harness-pins -type f -print -exec cat {} \; 2>/dev/null || true
          echo

      - name: Upload staged tree (debug artifact)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: harness-${{ inputs.channel }}
          path: staging-harness
          if-no-files-found: warn
          retention-days: 14
