name: Release Mobile

# Build the mobile app on EAS and publish a native-binary update pointer to R2.
#
# Android is the platform that can actually self-update: the APK goes to an
# immutable key under `mobile/android/` and `mobile/android/latest.json` points
# at it, so the installed app can fetch and install a newer build itself.
# The `alpha` profile is a separate app on both platforms (`.alpha` application
# id, its own TestFlight app) with its own pointers under `mobile/<platform>/alpha/`;
# it is what ships phone changes that need an alpha desktop. A stable build is
# refused before it is queued when its MIN_PHONE_DESKTOP_VERSION is above the
# released stable desktop.
#
# iOS cannot install anything from outside the App Store, so its leg submits to
# TestFlight and then publishes a manifest carrying only the numbers the app
# needs -- to nag, or to hard-gate a build below `minSupportedBuildCode`.
#
# What this deliberately does NOT do: raise the hard gate on its own. Leaving
# `min_supported_build_code` blank inherits whatever is already published.
# Raising it locks every older build out with no client-side way back, so it
# only ever moves when someone types a number here.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Which platform(s) to build and publish'
        required: true
        type: choice
        options:
          - android
          - ios
          - both
        default: both
      android_profile:
        description: 'EAS build profile for Android. `internal` is the stable self-hosted APK, `alpha` the alpha one; `production` is the Play Store AAB (which no phone can install from R2).'
        required: true
        type: choice
        options:
          - alpha
          - internal
          - production
        default: alpha
      ios_profile:
        description: 'EAS build profile for iOS. `alpha` is the SuperOne Alpha TestFlight app, `production` the stable TestFlight / App Store app; `internal` is an ad-hoc IPA that cannot be submitted.'
        required: true
        type: choice
        options:
          - alpha
          - production
          - internal
        default: alpha
      build_id:
        description: 'Publish an existing EAS build instead of starting a new one (Android only). Use this to re-point latest.json at an older build — that is the rollback.'
        required: false
        type: string
        default: ''
      min_supported_build_code:
        description: 'Raise (or lower) the hard gate. BLANK INHERITS the published value — only set this when old builds must be blocked.'
        required: false
        type: string
        default: ''
      testflight_url:
        description: 'Public TestFlight join link baked into the iOS manifest. Blank uses the track''s repository variable (TESTFLIGHT_URL_STABLE / TESTFLIGHT_URL_ALPHA); only set it for a one-off.'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Build and stage only — do not upload to R2'
        required: false
        type: boolean
        default: true
      ref:
        description: 'Branch or commit SHA to build'
        required: false
        default: 'main'
  workflow_call:
    inputs:
      platform:
        description: Which platform(s) to build and publish
        required: true
        type: string
        default: both
      android_profile:
        description: EAS build profile for Android (`alpha`, or `internal` for stable)
        required: false
        type: string
        default: alpha
      ios_profile:
        description: EAS build profile for iOS (`alpha`, or `production` for stable)
        required: false
        type: string
        default: alpha
      build_id:
        description: Publish an existing EAS build instead of starting a new one (Android only).
        required: false
        type: string
        default: ''
      min_supported_build_code:
        description: Raise the hard gate. Blank inherits the published value.
        required: false
        type: string
        default: ''
      testflight_url:
        description: Public TestFlight join link baked into the iOS manifest. Blank uses the track's link.
        required: false
        type: string
        default: ''
      dry_run:
        description: Build and stage only — do not upload to R2
        required: false
        type: boolean
        default: true
      ref:
        description: Branch or commit SHA to build
        required: false
        default: main
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Pinned, not `@latest`: a CLI that changes its --json shape under us would
  # silently publish the wrong artifact URL.
  EAS_CLI_VERSION: '24.0.0'
  INPUT_PLATFORM: ${{ inputs.platform }}
  INPUT_ANDROID_PROFILE: ${{ inputs.android_profile }}
  INPUT_IOS_PROFILE: ${{ inputs.ios_profile }}
  INPUT_BUILD_ID: ${{ inputs.build_id }}
  INPUT_MIN_SUPPORTED: ${{ inputs.min_supported_build_code }}
  INPUT_TESTFLIGHT_URL: ${{ inputs.testflight_url }}
  INPUT_DRY_RUN: ${{ inputs.dry_run }}
  # Public TestFlight links, one per app, from repository variables (Settings
  # -> Secrets and variables -> Actions -> Variables), so a link can change
  # without a commit; the next run writes it into that app's manifest. Set
  # once rather than retyped each release, where a typo would still pass the
  # prefix check and ship a dead link. App Store Connect -> TestFlight -> the
  # external group -> Public Link.
  #
  # The alpha link stays unset until its external group has one (that needs a
  # build through Beta App Review first). Until then alpha iOS runs still build
  # and submit but publish no manifest: TestFlight updates its testers itself,
  # and a manifest without a link is one the app rejects.
  TESTFLIGHT_URL_STABLE: ${{ vars.TESTFLIGHT_URL_STABLE }}
  TESTFLIGHT_URL_ALPHA: ${{ vars.TESTFLIGHT_URL_ALPHA }}

jobs:
  android:
    if: ${{ inputs.platform == 'android' || inputs.platform == 'both' }}
    runs-on: ubuntu-latest
    # Per platform and track rather than per dispatch: a `both` run and an
    # `android` re-dispatch must still queue behind each other on the same
    # latest.json, while platforms and tracks stay free to build in parallel.
    concurrency:
      group: release-mobile-android-${{ inputs.android_profile == 'alpha' && 'alpha' || 'stable' }}
      cancel-in-progress: false
    env:
      TRACK: ${{ inputs.android_profile == 'alpha' && 'alpha' || 'stable' }}
    timeout-minutes: 90
    permissions:
      # Tagging the published build, not pushing to a branch.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts

      # Before the queue, not at publish. A reused build_id is exempt: it is
      # how stable is rolled back, which must work while the desktop lags.
      - name: Check the stable desktop floor
        if: ${{ env.TRACK == 'stable' && inputs.build_id == '' }}
        run: bun scripts/publish-mobile-update.ts --check-stable-floor

      - name: Resolve the APK on EAS
        id: build
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::error::EXPO_TOKEN secret is not set — an EAS build cannot authenticate"
            exit 1
          fi
          if [ -n "${INPUT_BUILD_ID}" ]; then
            # Re-publishing an existing build is how a rollback is performed, and
            # it skips the EAS queue, which dominates the wall clock here.
            # `build:view` rejects --non-interactive but honours --json.
            echo "Reusing EAS build ${INPUT_BUILD_ID}"
            bunx "eas-cli@${EAS_CLI_VERSION}" build:view "${INPUT_BUILD_ID}" --json > build.json
          else
            # --json implies --non-interactive; logs go to stderr, so stdout is
            # the machine-readable half.
            bunx "eas-cli@${EAS_CLI_VERSION}" build \
              --platform android \
              --profile "${INPUT_ANDROID_PROFILE}" \
              --non-interactive \
              --wait \
              --json > build.json
          fi
          # eas-cli has printed both a bare object and an array here across
          # versions, and the artifact field has two spellings. Normalise both
          # rather than index blindly.
          NORMALISED='(if type=="array" then . else [.] end)
            | map(select(.platform == "ANDROID" and .status == "FINISHED"))
            | .[0]'
          URL="$(jq -r "${NORMALISED} | .artifacts.applicationArchiveUrl // .artifacts.buildUrl // empty" build.json)"
          BUILD_CODE="$(jq -r "${NORMALISED} | .appBuildVersion // empty" build.json)"
          APP_VERSION="$(jq -r "${NORMALISED} | .appVersion // empty" build.json)"
          if [ -z "${URL}" ] || [ -z "${BUILD_CODE}" ] || [ -z "${APP_VERSION}" ]; then
            echo "::error::could not read a finished Android build out of the eas-cli --json output"
            head -c 4000 build.json
            exit 1
          fi
          case "${BUILD_CODE}" in
            ''|*[!0-9]*)
              echo "::error::appBuildVersion ${BUILD_CODE} is not a version code"
              exit 1
              ;;
          esac
          # The `production` profile emits an AAB, which no phone can install
          # from a file. Catching it here beats publishing a latest.json that
          # every client downloads and then fails to open.
          case "${URL}" in
            *.apk) ;;
            *)
              echo "::error::artifact ${URL} is not an APK — only APK builds can be self-installed"
              exit 1
              ;;
          esac
          # The profile decides the application id, so it decides which
          # pointer the APK may land on. A reused build from the other track
          # would install over nothing on the target phones -- or, for an alpha
          # build on the stable pointer, carry the very floor this split exists
          # to keep away from stable users.
          PROFILE="$(jq -r "${NORMALISED} | .buildProfile // empty" build.json)"
          if [ "${PROFILE}" != "${INPUT_ANDROID_PROFILE}" ]; then
            echo "::error::build profile ${PROFILE:-unknown} does not match android_profile=${INPUT_ANDROID_PROFILE}"
            exit 1
          fi
          # The build's own commit, not this checkout: reusing an existing
          # build publishes an artifact from an older tree, and the tag has to
          # name that tree rather than whatever main happens to be.
          BUILD_COMMIT="$(jq -r "${NORMALISED} | .gitCommitHash // empty" build.json)"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "build_code=${BUILD_CODE}" >> "$GITHUB_OUTPUT"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_commit=${BUILD_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "Built ${APP_VERSION} (${BUILD_CODE}) from ${BUILD_COMMIT:-unknown}"

      - name: Download APK
        env:
          # Signed and short-lived, so it is fetched in the same job that
          # produced it rather than passed between jobs.
          ARTIFACT_URL: ${{ steps.build.outputs.url }}
        run: |
          set -euo pipefail
          curl -fSL --retry 3 --retry-delay 5 -o superone.apk "${ARTIFACT_URL}"
          ls -l superone.apk

      - name: Publish to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_DEFAULT_REGION: auto
          APP_VERSION: ${{ steps.build.outputs.app_version }}
          BUILD_CODE: ${{ steps.build.outputs.build_code }}
        run: |
          set -euo pipefail
          ARGS=(--platform android --track "${TRACK}" --version "${APP_VERSION}" --build-code "${BUILD_CODE}"
                --apk superone.apk --out staging-mobile)
          if [ -n "${INPUT_MIN_SUPPORTED}" ]; then
            ARGS+=(--min-supported-build-code "${INPUT_MIN_SUPPORTED}")
          fi
          # Re-publishing an existing build is the documented rollback, which
          # the script refuses without the flag when it moves latest.json back.
          if [ -n "${INPUT_BUILD_ID}" ]; then
            ARGS+=(--rollback)
          fi
          if [ "${INPUT_DRY_RUN}" != "true" ]; then
            ARGS+=(--upload)
          fi
          bun scripts/publish-mobile-update.ts "${ARGS[@]}" | tee publish.log
          {
            echo "### Android ${TRACK} ${APP_VERSION} (${BUILD_CODE})"
            echo
            echo '```'
            cat publish.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tag the published build
        id: tag
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_COMMIT: ${{ steps.build.outputs.build_commit }}
          APP_VERSION: ${{ steps.build.outputs.app_version }}
          BUILD_CODE: ${{ steps.build.outputs.build_code }}
          TAG_PLATFORM: ${{ inputs.android_profile == 'alpha' && 'android-alpha' || 'android' }}
        run: |
          set -euo pipefail
          if [ -z "${BUILD_COMMIT}" ]; then
            echo "::warning::EAS reported no commit for this build; skipping the tag"
            exit 0
          fi
          # Per platform, and not in the `v*` namespace. `v*` belongs to the
          # desktop line, where a mobile `v1.0.0` would be a valid semver above
          # every desktop version and would collide with a future release. The
          # platform segment is required too: the two platforms share one build
          # code but are built from whatever main was at their own dispatch, so
          # one code does not imply one commit.
          # The two tracks share the build code, so the track is in the tag.
          TAG="mobile/${TAG_PLATFORM}/v${APP_VERSION}-build${BUILD_CODE}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "${TAG} already exists -- re-publishing the same build, nothing to tag"
            exit 0
          fi
          # Through the API rather than `git tag`: this checkout is --depth=1
          # and does not hold the build's commit object.
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${TAG}" -f sha="${BUILD_COMMIT}" >/dev/null
          echo "Tagged ${TAG} -> ${BUILD_COMMIT}"

      # An archive beside the desktop releases: the APK, the desktop it needs,
      # and its checksum. Not a download source -- in-app updates and any
      # desktop-side link read the R2 pointer, which is the only place that
      # knows the current build per track. Never marked Latest: that badge
      # belongs to the stable desktop, which the site and users look for.
      - name: GitHub Release
        if: ${{ inputs.dry_run != true && steps.tag.outputs.tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          BUILD_COMMIT: ${{ steps.build.outputs.build_commit }}
          APP_VERSION: ${{ steps.build.outputs.app_version }}
          BUILD_CODE: ${{ steps.build.outputs.build_code }}
          ALPHA: ${{ inputs.android_profile == 'alpha' }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists -- re-publishing the same build, nothing to add"
            exit 0
          fi
          if [ "${ALPHA}" = "true" ]; then
            LABEL="Android Alpha"; ASSET="SuperOne-Android-Alpha-v${APP_VERSION}-build${BUILD_CODE}.apk"; PRE=(--prerelease)
          else
            LABEL="Android"; ASSET="SuperOne-Android-v${APP_VERSION}-build${BUILD_CODE}.apk"; PRE=()
          fi
          # The floor of the build's own tree: a reused build_id may come from
          # an older commit than this checkout.
          MIN_DESKTOP="$(gh api "repos/${GITHUB_REPOSITORY}/contents/packages/relay-client/src/phone-version.ts?ref=${BUILD_COMMIT}" \
            -H 'Accept: application/vnd.github.raw' \
            | sed -n "s/^export const MIN_PHONE_DESKTOP_VERSION = '\\(.*\\)'.*/\\1/p")"
          SHA256="$(sha256sum superone.apk | cut -d' ' -f1)"
          {
            echo "SuperOne ${LABEL} ${APP_VERSION} (build ${BUILD_CODE})."
            echo
            if [ -n "${MIN_DESKTOP}" ]; then
              echo "Requires SuperOne desktop ${MIN_DESKTOP} or later."
              echo
            fi
            echo "Installed apps update themselves; this file is for a first install."
            echo
            echo "SHA-256: \`${SHA256}\`"
          } > notes.md
          cp superone.apk "${ASSET}"
          gh release create "${TAG}" "${ASSET}" "${PRE[@]}" --verify-tag --latest=false \
            --title "SuperOne ${LABEL} ${APP_VERSION} (build ${BUILD_CODE})" --notes-file notes.md
          echo "Released ${TAG} with ${ASSET}"

      - name: Upload staged tree (debug artifact)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-android-${{ github.run_id }}
          path: |
            staging-mobile/mobile/android/**/latest.json
            apps/mobile/build.json
          if-no-files-found: warn
          retention-days: 14

  ios:
    if: ${{ inputs.platform == 'ios' || inputs.platform == 'both' }}
    runs-on: ubuntu-latest
    concurrency:
      group: release-mobile-ios-${{ inputs.ios_profile == 'alpha' && 'alpha' || 'stable' }}
      cancel-in-progress: false
    env:
      TRACK: ${{ inputs.ios_profile == 'alpha' && 'alpha' || 'stable' }}
    timeout-minutes: 120
    permissions:
      # Tagging the published build, not pushing to a branch.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Check inputs
        run: |
          set -euo pipefail
          if [ -n "${INPUT_BUILD_ID}" ]; then
            echo "::error::build_id is Android-only; the iOS leg submits --latest to TestFlight"
            exit 1
          fi
          if [ "${TRACK}" = alpha ]; then DEFAULT_URL="${TESTFLIGHT_URL_ALPHA}"; else DEFAULT_URL="${TESTFLIGHT_URL_STABLE}"; fi
          TESTFLIGHT_URL="${INPUT_TESTFLIGHT_URL:-${DEFAULT_URL}}"
          if [ -z "${TESTFLIGHT_URL}" ] && [ "${TRACK}" = alpha ]; then
            echo "::warning::no TestFlight link for the alpha app yet; building and submitting without publishing its manifest"
            echo "PUBLISH_MANIFEST=false" >> "$GITHUB_ENV"
          elif [ -z "${TESTFLIGHT_URL}" ]; then
            echo "::error::no TestFlight link for the ${TRACK} app; set the TESTFLIGHT_URL_${TRACK^^} repository variable"
            exit 1
          fi
          # `eas submit` only accepts an app-store distribution build; an
          # `internal` (ad-hoc) IPA would build for 30 minutes and then fail
          # to submit. Catch it before the queue, not after.
          if [ "${INPUT_DRY_RUN}" != "true" ]; then
            case "${INPUT_IOS_PROFILE}" in
              alpha|production) ;;
              *)
                echo "::error::ios_profile=${INPUT_IOS_PROFILE} cannot be submitted to TestFlight; use alpha or production, or dry_run=true to only build"
                exit 1
                ;;
            esac
            # Each app has its own App Store Connect record; submitting without
            # one would prompt, which a non-interactive run cannot answer.
            ASC_APP_ID="$(jq -r --arg p "${INPUT_IOS_PROFILE}" '.submit[$p].ios.ascAppId // empty' apps/mobile/eas.json)"
            case "${ASC_APP_ID}" in
              ''|*[!0-9]*)
                echo "::error::apps/mobile/eas.json has no submit.${INPUT_IOS_PROFILE}.ios.ascAppId for the ${TRACK} app"
                exit 1
                ;;
            esac
          fi
          echo "TestFlight link: ${TESTFLIGHT_URL:-(none)}"
          echo "TESTFLIGHT_URL=${TESTFLIGHT_URL}" >> "$GITHUB_ENV"

          case "${TESTFLIGHT_URL}" in
            ''|https://testflight.apple.com/*) ;;
            *) echo "::error::testflight_url must be a https://testflight.apple.com/ link"; exit 1 ;;
          esac

      # Before the queue: TestFlight receives the build before any manifest is
      # published, so this is the last point a stable build can be stopped.
      - name: Check the stable desktop floor
        if: ${{ env.TRACK == 'stable' }}
        run: bun scripts/publish-mobile-update.ts --check-stable-floor

      - name: Build on EAS
        id: build
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::error::EXPO_TOKEN secret is not set — an EAS build cannot authenticate"
            exit 1
          fi
          bunx "eas-cli@${EAS_CLI_VERSION}" build \
            --platform ios \
            --profile "${INPUT_IOS_PROFILE}" \
            --non-interactive \
            --wait \
            --json > build.json
          NORMALISED='(if type=="array" then . else [.] end)
            | map(select(.platform == "IOS" and .status == "FINISHED"))
            | .[0]'
          BUILD_CODE="$(jq -r "${NORMALISED} | .appBuildVersion // empty" build.json)"
          APP_VERSION="$(jq -r "${NORMALISED} | .appVersion // empty" build.json)"
          if [ -z "${BUILD_CODE}" ] || [ -z "${APP_VERSION}" ]; then
            echo "::error::could not read a finished iOS build out of eas-cli --json output"
            head -c 4000 build.json
            exit 1
          fi
          case "${BUILD_CODE}" in
            ''|*[!0-9]*)
              echo "::error::appBuildVersion ${BUILD_CODE} is not a build number"
              exit 1
              ;;
          esac
          BUILD_COMMIT="$(jq -r "${NORMALISED} | .gitCommitHash // empty" build.json)"
          echo "build_code=${BUILD_CODE}" >> "$GITHUB_OUTPUT"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_commit=${BUILD_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "Built ${APP_VERSION} (${BUILD_CODE}) from ${BUILD_COMMIT:-unknown}"

      - name: Submit to TestFlight
        if: ${{ inputs.dry_run != true }}
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          bunx "eas-cli@${EAS_CLI_VERSION}" submit \
            --platform ios \
            --profile "${INPUT_IOS_PROFILE}" \
            --latest \
            --non-interactive

      - name: Publish manifest to R2
        if: ${{ env.PUBLISH_MANIFEST != 'false' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_DEFAULT_REGION: auto
          APP_VERSION: ${{ steps.build.outputs.app_version }}
          BUILD_CODE: ${{ steps.build.outputs.build_code }}
        run: |
          set -euo pipefail
          ARGS=(--platform ios --track "${TRACK}" --version "${APP_VERSION}" --build-code "${BUILD_CODE}"
                --testflight-url "${TESTFLIGHT_URL}" --out staging-mobile)
          if [ -n "${INPUT_MIN_SUPPORTED}" ]; then
            ARGS+=(--min-supported-build-code "${INPUT_MIN_SUPPORTED}")
          fi
          if [ "${INPUT_DRY_RUN}" != "true" ]; then
            ARGS+=(--upload)
          fi
          bun scripts/publish-mobile-update.ts "${ARGS[@]}" | tee publish.log
          {
            echo "### iOS ${TRACK} ${APP_VERSION} (${BUILD_CODE})"
            echo
            echo '```'
            cat publish.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tag the published build
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_COMMIT: ${{ steps.build.outputs.build_commit }}
          APP_VERSION: ${{ steps.build.outputs.app_version }}
          BUILD_CODE: ${{ steps.build.outputs.build_code }}
        run: |
          set -euo pipefail
          if [ -z "${BUILD_COMMIT}" ]; then
            echo "::warning::EAS reported no commit for this build; skipping the tag"
            exit 0
          fi
          # Per platform, and not in the `v*` namespace. `v*` belongs to the
          # desktop line, where a mobile `v1.0.0` would be a valid semver above
          # every desktop version and would collide with a future release. The
          # platform segment is required too: the two platforms share one build
          # code but are built from whatever main was at their own dispatch, so
          # one code does not imply one commit.
          # The two apps share the build code, so the track is in the tag.
          if [ "${TRACK}" = alpha ]; then TAG_PLATFORM=ios-alpha; else TAG_PLATFORM=ios; fi
          TAG="mobile/${TAG_PLATFORM}/v${APP_VERSION}-build${BUILD_CODE}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "${TAG} already exists -- re-publishing the same build, nothing to tag"
            exit 0
          fi
          # Through the API rather than `git tag`: this checkout is --depth=1
          # and does not hold the build's commit object.
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${TAG}" -f sha="${BUILD_COMMIT}" >/dev/null
          echo "Tagged ${TAG} -> ${BUILD_COMMIT}"
