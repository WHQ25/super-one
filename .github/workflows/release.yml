name: Release

# Two explicit stages under the npm-trusted caller identity release.yml.
# prepare: build + archive a desktop draft only.
# publish: after desktop publication and set-latest, verify the tag and three
# live feeds before releasing CLI, harness, relay and mobile OTA from its SHA.
# The default prepare stage cannot publish any of these components.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'prepare builds desktop; publish releases components after desktop is live'
        required: true
        type: choice
        options: [prepare, publish]
        default: prepare
      variant:
        description: 'Which side-by-side app to release'
        required: true
        type: choice
        options:
          - alpha
          - stable
      ref:
        description: 'prepare: source SHA; publish: published desktop tag (vX.Y.Z[-alpha.N])'
        required: false
        default: 'main'
      version:
        description: 'Override the BASE version (plain X.Y.Z, the variant appends its own tag). Blank = package.json at ref.'
        required: false
        default: ''
      prerelease_n:
        description: 'Alpha/dev sequence after the tag (1 → 0.63.0-alpha.1). Blank/0 = no suffix. Ignored — and rejected — for stable.'
        required: false
        default: ''
      mac_bridge:
        description: 'Also build the macOS bridge (retired bundle id → latest-mac.yml). Only for the one release that moves the bundle id; see packaging.md.'
        required: false
        type: boolean
        default: false

      publish_cli:
        description: 'Publish the matching CLI npm version'
        type: boolean
        default: true
      publish_harness:
        description: 'Refresh harness mirrors and app-version pins'
        type: boolean
        default: false
      deploy_relay:
        description: 'Deploy this variant relay'
        type: boolean
        default: false
      mobile_ota:
        description: 'Mobile platforms that passed the runtime preflight'
        type: choice
        options: [none, android, ios, both]
        default: none

concurrency:
  group: release-${{ inputs.variant }}-${{ inputs.stage }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  INPUT_REF: ${{ inputs.ref }}
  INPUT_VARIANT: ${{ inputs.variant }}
  INPUT_VERSION: ${{ inputs.version }}
  INPUT_PRERELEASE_N: ${{ inputs.prerelease_n }}

jobs:
  # Derive everything the legs need from the ref, so the tag, the packaged
  # version and the npm dist-tag cannot disagree with each other.
  plan:
    if: ${{ inputs.stage == 'prepare' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
      npm_tag: ${{ steps.plan.outputs.npm_tag }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
      - name: Resolve version, tag and dist-tag
        id: plan
        run: |
          set -euo pipefail
          # Same derivation as electron-builder.config.cjs (packaged-version.cjs).
          VERSION="$(node -e "
            const { resolvePackagedVersion } = require('./apps/desktop/packaged-version.cjs');
            const pkg = require('./package.json');
            process.stdout.write(resolvePackagedVersion(pkg.version, process.env.INPUT_VARIANT, {
              versionOverride: process.env.INPUT_VERSION,
              prereleaseN: process.env.INPUT_PRERELEASE_N,
            }));
          ")"
          case "$VERSION" in
            *-alpha*) NPM_TAG=alpha ;;
            *-*) echo "::error::unmapped prerelease $VERSION"; exit 1 ;;
            *) NPM_TAG=latest ;;
          esac
          TAG="v${VERSION}"
          # Tags are created by GitHub when the draft is published; a tag that
          # already exists means this version shipped. Bump instead of re-cutting.
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::${TAG} already exists on origin — this version has been published"
            exit 1
          fi
          {
            echo "version=${VERSION}"
            echo "release_tag=${TAG}"
            echo "npm_tag=${NPM_TAG}"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Release plan"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| variant | \`${INPUT_VARIANT}\` |"
            echo "| version | \`${VERSION}\` |"
            echo "| prerelease_n | \`${INPUT_PRERELEASE_N:-}\` |"
            echo "| tag | \`${TAG}\` |"
            echo "| commit | \`$(git rev-parse HEAD)\` |"
            echo "| npm dist-tag | \`${NPM_TAG}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  build-mac:
    needs: plan
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-mac.yml
    secrets: inherit
    with:
      ref: ${{ inputs.ref }}
      variant: ${{ inputs.variant }}
      version: ${{ inputs.version }}
      prerelease_n: ${{ inputs.prerelease_n }}

  # Same commit, packaged under the retired macOS bundle id. Old-id clients
  # auto-update onto it through Squirrel and are then told to install the
  # new-id build by hand; the new-id build above is what they install.
  build-mac-bridge:
    if: ${{ inputs.mac_bridge }}
    needs: plan
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-mac.yml
    secrets: inherit
    with:
      ref: ${{ inputs.ref }}
      variant: ${{ inputs.variant }}
      version: ${{ inputs.version }}
      prerelease_n: ${{ inputs.prerelease_n }}
      bridge: true
  build-win:
    needs: plan
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-win.yml
    secrets: inherit
    with:
      ref: ${{ inputs.ref }}
      variant: ${{ inputs.variant }}
      version: ${{ inputs.version }}
      prerelease_n: ${{ inputs.prerelease_n }}

  build-linux:
    needs: plan
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-linux.yml
    secrets: inherit
    with:
      ref: ${{ inputs.ref }}
      variant: ${{ inputs.variant }}
      version: ${{ inputs.version }}
      prerelease_n: ${{ inputs.prerelease_n }}

  # Draft GitHub Release + R2 archive. Artifacts come from this very run.
  promote:
    # `always()` keeps this reachable when the optional bridge job is skipped;
    # the explicit result checks keep it from running on a failed build.
    if: ${{ always() && needs.plan.result == 'success' && needs.build-mac.result == 'success' && needs.build-win.result == 'success' && needs.build-linux.result == 'success' && (needs.build-mac-bridge.result == 'success' || needs.build-mac-bridge.result == 'skipped') }}
    needs: [plan, build-mac, build-mac-bridge, build-win, build-linux]
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/promote.yml
    secrets: inherit
    with:
      release_tag: ${{ needs.plan.outputs.release_tag }}
      variant: ${{ inputs.variant }}
      target_sha: ${{ needs.plan.outputs.sha }}
      mac_run_id: ${{ github.run_id }}
      mac_bridge: ${{ inputs.mac_bridge }}
      win_run_id: ${{ github.run_id }}
      linux_run_id: ${{ github.run_id }}

  ready:
    if: ${{ inputs.stage == 'publish' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ready.outputs.version }}
      npm_tag: ${{ steps.ready.outputs.npm_tag }}
      sha: ${{ steps.ready.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify published desktop and all live update feeds
        id: ready
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          INPUT_TAG: ${{ inputs.ref }}
          INPUT_VARIANT: ${{ inputs.variant }}
        run: bun scripts/release-followups-preflight.ts "$INPUT_TAG" "$INPUT_VARIANT"

  publish-cli:
    if: ${{ inputs.stage == 'publish' && inputs.publish_cli }}
    needs: ready
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-cli.yml
    secrets: inherit
    with:
      ref: ${{ needs.ready.outputs.sha }}
      version: ${{ needs.ready.outputs.version }}
      tag: ${{ needs.ready.outputs.npm_tag }}
      dry_run: false

  publish-harness:
    if: ${{ inputs.stage == 'publish' && inputs.publish_harness }}
    needs: ready
    permissions:
      contents: read
    uses: ./.github/workflows/publish-harness.yml
    secrets: inherit
    with:
      ref: ${{ needs.ready.outputs.sha }}
      channel: ${{ inputs.variant }}
      app_version: ${{ needs.ready.outputs.version }}
      dry_run: false

  deploy-relay:
    if: ${{ inputs.stage == 'publish' && inputs.deploy_relay }}
    needs: ready
    uses: ./.github/workflows/deploy-relay.yml
    secrets: inherit
    with:
      ref: ${{ needs.ready.outputs.sha }}
      channel: ${{ inputs.variant }}
      message: ${{ inputs.ref }} (${{ needs.ready.outputs.sha }})

  mobile-ota:
    if: ${{ inputs.stage == 'publish' && inputs.mobile_ota != 'none' }}
    needs: ready
    uses: ./.github/workflows/update-mobile.yml
    secrets: inherit
    with:
      ref: ${{ needs.ready.outputs.sha }}
      platform: ${{ inputs.mobile_ota }}
      android_channel: ${{ inputs.variant == 'alpha' && 'alpha' || 'internal' }}
      ios_channel: ${{ inputs.variant == 'alpha' && 'alpha' || 'production' }}
      message: ${{ inputs.ref }}
      dry_run: false
