name: Release

on:
  push:
    tags:
      - v*

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SO_CF_RELAY_URL: ${{ secrets.SO_CF_RELAY_URL }}

jobs:
  release-mac:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build:mac -- --arch ${{ matrix.arch }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          UPDATER_TOKEN: ${{ secrets.UPDATER_TOKEN }}
          SO_SUPABASE_URL: ${{ secrets.SO_SUPABASE_URL }}
          SO_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SO_SUPABASE_PUBLISHABLE_KEY }}

  release-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build:win -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATER_TOKEN: ${{ secrets.UPDATER_TOKEN }}
          SO_SUPABASE_URL: ${{ secrets.SO_SUPABASE_URL }}
          SO_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SO_SUPABASE_PUBLISHABLE_KEY }}

  release-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build:linux -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATER_TOKEN: ${{ secrets.UPDATER_TOKEN }}
          SO_SUPABASE_URL: ${{ secrets.SO_SUPABASE_URL }}
          SO_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SO_SUPABASE_PUBLISHABLE_KEY }}
