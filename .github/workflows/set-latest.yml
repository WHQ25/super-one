name: Set Latest

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to set as latest (e.g. v0.40.1-alpha)'
        required: true
      variant:
        description: 'Which side-by-side app to publish this version to'
        required: true
        type: choice
        options:
          - alpha
          - stable
      force:
        description: 'Force — allow rolling a variant back to an older version (override the semver guard)'
        required: false
        type: boolean
        default: false
      legacy_root:
        description: 'Legacy bridge — also refresh the pre-variant root manifests (alpha-*.yml) so already-installed clients cross over to this build. stable only.'
        required: false
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  INPUT_FORCE: ${{ inputs.force }}
  INPUT_LEGACY_ROOT: ${{ inputs.legacy_root }}
  INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
  INPUT_VARIANT: ${{ inputs.variant }}

jobs:
  set-latest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Download update manifests from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p manifests
          gh release download "${INPUT_RELEASE_TAG}" -D manifests -p '*.yml'
          echo "--- downloaded manifests ---"
          ls -la manifests/

      - name: Ensure release binaries are on R2 (backfill from GitHub if missing)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          VERSION="${INPUT_RELEASE_TAG}"; VERSION="${VERSION#v}"
          PREFIX="${INPUT_VARIANT}/v${VERSION}"
          if [ -n "$(aws s3 ls "s3://super-one-releases/${PREFIX}/" --endpoint-url "$ENDPOINT" 2>/dev/null)" ]; then
            echo "${PREFIX}/ already on R2 — no backfill needed"
            exit 0
          fi
          echo "${PREFIX}/ missing on R2 — backfilling binaries from the GitHub Release"
          mkdir -p binstage
          gh release download "${INPUT_RELEASE_TAG}" -D binstage \
            -p '*.dmg' -p '*.zip' -p '*.exe' -p '*.AppImage' -p '*.blockmap'
          echo "--- downloaded ---"; ls -la binstage/
          aws s3 cp binstage/ "s3://super-one-releases/${PREFIX}/" --recursive \
            --endpoint-url "$ENDPOINT" --no-progress
          echo "Backfilled ${PREFIX}/ to R2"

      - name: Compute manifests + fixed-link plan
        # The semver guard asks what is currently live. It has to ask the
        # BUCKET: dl.super-one.dev answers a missing object with 403 for a
        # runner and 404 for a browser, so over the public URL the
        # "never published" branch is unreachable from CI and a first publish
        # to any new variant prefix fails.
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -euo pipefail
          bun scripts/set-latest.ts \
            "${INPUT_RELEASE_TAG}" \
            "${INPUT_VARIANT}" \
            "${INPUT_FORCE}" \
            manifests \
            https://dl.super-one.dev \
            out \
            fixed-copies.json \
            "${INPUT_LEGACY_ROOT}"
          echo "--- staged manifests ---"
          ls -la out/ 2>/dev/null || echo "(none staged — semver guard held; rerun with force=true to override)"
          echo "--- fixed-link plan ---"
          cat fixed-copies.json

      - name: Publish manifests + fixed download links to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          if [ -z "$(ls -A out 2>/dev/null)" ]; then
            echo "::warning::No manifests staged — nothing published (semver guard held; rerun with force=true to override)"
            exit 0
          fi
          aws s3 cp out/ s3://super-one-releases/ --recursive \
            --endpoint-url "$ENDPOINT" --no-progress
          jq -c '.[]' fixed-copies.json | while read -r row; do
            src=$(echo "$row" | jq -r .src)
            dst=$(echo "$row" | jq -r .dst)
            echo "cp ${src} -> ${dst}"
            aws s3 cp "s3://super-one-releases/${src}" "s3://super-one-releases/${dst}" \
              --endpoint-url "$ENDPOINT" --cache-control "public, max-age=300" \
              --copy-props none --no-progress
          done
          echo "Set ${INPUT_RELEASE_TAG} as latest of the ${INPUT_VARIANT} app."
          if [ "${INPUT_LEGACY_ROOT}" = "true" ]; then
            echo "::notice::Legacy bridge on — pre-variant clients polling the bucket root were pointed at ${INPUT_VARIANT}/."
          fi
