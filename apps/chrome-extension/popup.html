<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { margin: 0; font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1c1917; background: #faf8f5; }
      main { width: 260px; padding: 14px; }
      p { margin: 0 0 12px; color: #57534e; }
      button { width: 100%; border: 0; border-radius: 8px; padding: 8px 10px; background: #1c1917; color: #faf8f5; }
      button[disabled] { opacity: 0.45; }
      .status { font-weight: 600; color: #1c1917; }
    </style>
  </head>
  <body>
    <main>
      <p class="status" id="status"></p>
      <p id="hint"></p>
      <button id="share" type="button"></button>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
