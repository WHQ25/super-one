# Shared electron-builder base. NOT a complete config on its own.
#
# Every identity field (appId, productName, package.json name, icon,
# linux.executableName, publish target, output dir) is owned by variants.json
# and applied by electron-builder.config.cjs. Do not reintroduce them here —
# two sources of truth is exactly how the stable and alpha builds would drift
# into colliding on one install directory or one update manifest.
#
# Build with: SUPERONE_VARIANT=<stable|alpha> electron-builder --config electron-builder.config.cjs
# Optionally SUPERONE_VERSION=<semver> to package a commit under a different
# version (cutting stable from a validated alpha tree without a bump commit).

directories:
  output: dist

files:
  - out/**/*
  # Third-party sourcemaps. electron-builder includes node_modules implicitly, so
  # every dependency's .map ships too — 222 MB of the asar, a third of it. Node and
  # Chromium only read these with devtools open or --enable-source-maps, neither of
  # which a packaged build does. Scoped to node_modules so enabling sourcemaps for
  # our own bundles stays a decision this line does not silently override.
  - "!node_modules/**/*.map"
  # Package cruft: TypeScript sources, test suites, demos, docs. Anchored inside
  # node_modules on purpose — a bare !**/test/** could hit a package that ships
  # runtime code in a directory named test. Order is load-bearing (the matcher
  # is last-match-wins, like .gitignore): the positive pattern re-includes type
  # declarations that *.ts would otherwise drop, the directory exclusion after
  # it strips declarations living inside test dirs anyway, and the renderer-only
  # package negations further down get the final say for their packages, so this
  # re-include cannot resurrect their .d.ts files. Verified: no main/preload
  # runtime path resolves through a real .ts source — the only workspace package
  # main needs (@superone/shared) is bundled inline by electron-vite.
  - "!node_modules/**/*.{ts,mts,cts}"
  - "node_modules/**/*.d.{ts,mts,cts}"
  - "!node_modules/**/{test,tests,__tests__,demo,docs,example,examples}/**"
  # sqlite3.c amalgamation + C++ sources — only needed to rebuild from source,
  # never at runtime (the prebuilt .node is what loads).
  - "!node_modules/better-sqlite3/{deps,src}/**"
  # Renderer-only packages. Vite inlines the renderer's dependencies into
  # out/renderer/assets at build time, so the node_modules copies below are dead
  # weight — verified zero imports from src/main and src/preload. NOT on this
  # list on purpose: `shiki` (src/main/remote-highlighter.ts imports it) and
  # `sharp`/`@img` (dependency of @deepseek-ai/dsh-attachment-local, a Cordis
  # plugin loaded by string name — invisible to static analysis). Every pattern
  # needs the trailing `/**`: a bare package path matches only the directory
  # entry and excludes nothing.
  - "!node_modules/mermaid/**"
  - "!node_modules/@mermaid-js/parser/**"
  - "!node_modules/posthog-js/**"
  - "!node_modules/lucide-react/**"
  - "!node_modules/pdfjs-dist/**"
  - "!node_modules/@napi-rs/canvas*/**"
  - "!node_modules/@emoji-mart/data/**"
  - "!node_modules/katex/**"
  - "!node_modules/recharts/**"
  - "!node_modules/cytoscape*/**"
  - "!node_modules/elkjs/**"
  - "!node_modules/date-fns/**"
  - "!node_modules/date-fns-jalali/**"
  - "!node_modules/@lobehub/**"
  - "!node_modules/@base-ui/**"
  - "!node_modules/@splinetool/runtime/**"
  - "!node_modules/prettier/**"
  # P5: do not ship managed harness platform binaries (~500MB+). Runtimes
  # install on demand via Settings → Harnesses (R2/npm tarball).
  - "!node_modules/@anthropic-ai/claude-agent-sdk-darwin-*/**"
  - "!node_modules/@anthropic-ai/claude-agent-sdk-linux-*/**"
  - "!node_modules/@anthropic-ai/claude-agent-sdk-win32-*/**"
  - "!node_modules/@openai/codex-darwin-*/**"
  - "!node_modules/@openai/codex-linux-*/**"
  - "!node_modules/@openai/codex-win32-*/**"

extraResources:
  - from: build/icon.png
    to: icon.png
  # User-approved closed-lid mode installs the narrow macOS root watchdog from
  # these signed package resources. Windows and Linux ignore the two tiny files.
  - from: resources/lid-keep-awake
    to: lid-keep-awake
    filter:
      - "macos-helper.sh"
      - "com.superone.lid-keep-awake.plist"
  # iOS Simulator private APIs move with Xcode. Ship source and compile the
  # small helper into userData against the user's selected toolchain.
  - from: native/ios-simulator-helper
    to: ios-simulator-helper
    filter:
      - "build.sh"
      - "Sources/**"
      - "README.md"
  # The scrcpy server, which is pushed to an Android device and run there via
  # app_process. Vendored rather than downloaded so a first run works offline, and
  # because client and server versions must match exactly — a drifting download would
  # break the protocol implemented beside it. Verified by sha256 before every push.
  - from: resources/scrcpy
    to: scrcpy
    filter:
      - "*.jar"
  # The dsh agent presets. They are read with `readdir` by the preset roster and
  # their rows are dynamically imported by the Loader, so they ship unpacked
  # beside the app rather than inside the asar bundle.
  - from: resources/agent-presets
    to: agent-presets

afterPack: "./build/afterPack.cjs"

asarUnpack:
  # Native addons only — harness CLIs are no longer unpacked into the app.
  - "**/*.node"
  # Cursor platform helpers (cursorsandbox, rg, tree-sitter .node). Do not
  # unpack @cursor/sdk JS — only the optional `@cursor/sdk-<platform>` package.
  - "node_modules/@cursor/sdk-*/**"
  # sharp's libvips packages ship .so/.dylib, not .node, so **/*.node never
  # unpacks them. The addon require.resolve()s this binary then dlopens it.
  - "node_modules/@img/sharp-libvips-*/**"

mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  extendInfo:
    NSCameraUsageDescription: SuperOne mini-apps can access the camera when you grant permission.
    NSMicrophoneUsageDescription: SuperOne uses the microphone for voice conversations and approved mini-apps.

win:
  target:
    - nsis

linux:
  target:
    - AppImage
  category: Development
