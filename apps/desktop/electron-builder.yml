appId: com.superone.app
productName: SuperOne
directories:
  output: dist

files:
  - out/**/*
  # Third-party sourcemaps. electron-builder includes node_modules implicitly, so
  # every dependency's .map ships too — 222 MB of the asar, a third of it. Node and
  # Chromium only read these with devtools open or --enable-source-maps, neither of
  # which a packaged build does. Scoped to node_modules so enabling sourcemaps for
  # our own bundles stays a decision this line does not silently override.
  - "!node_modules/**/*.map"
  - "!node_modules/@img/sharp-*"
  # P5: do not ship managed harness platform binaries (~500MB+). Runtimes
  # install on demand via Settings → Harnesses (R2/npm tarball).
  - "!node_modules/@anthropic-ai/claude-agent-sdk-darwin-*/**"
  - "!node_modules/@anthropic-ai/claude-agent-sdk-linux-*/**"
  - "!node_modules/@anthropic-ai/claude-agent-sdk-win32-*/**"
  - "!node_modules/@openai/codex-darwin-*/**"
  - "!node_modules/@openai/codex-linux-*/**"
  - "!node_modules/@openai/codex-win32-*/**"

extraResources:
  - from: build/icon.png
    to: icon.png
  # iOS Simulator private APIs move with Xcode. Ship source and compile the
  # small helper into userData against the user's selected toolchain.
  - from: native/ios-simulator-helper
    to: ios-simulator-helper
    filter:
      - "build.sh"
      - "Sources/**"
      - "README.md"
  # The scrcpy server, which is pushed to an Android device and run there via
  # app_process. Vendored rather than downloaded so a first run works offline, and
  # because client and server versions must match exactly — a drifting download would
  # break the protocol implemented beside it. Verified by sha256 before every push.
  - from: resources/scrcpy
    to: scrcpy
    filter:
      - "*.jar"
  # The dsh agent presets. They are read with `readdir` by the preset roster and
  # their rows are dynamically imported by the Loader, so they ship unpacked
  # beside the app rather than inside the asar bundle.
  - from: resources/agent-presets
    to: agent-presets

afterPack: "./build/afterPack.cjs"

asarUnpack:
  # Native addons only — harness CLIs are no longer unpacked into the app.
  - "**/*.node"
  # Cursor platform helpers (cursorsandbox, rg, tree-sitter .node). Do not
  # unpack @cursor/sdk JS — only the optional `@cursor/sdk-<platform>` package.
  - "node_modules/@cursor/sdk-*/**"

publish:
  provider: generic
  url: https://dl.super-one.dev

mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  extendInfo:
    NSCameraUsageDescription: SuperOne mini-apps can access the camera when you grant permission.
    NSMicrophoneUsageDescription: SuperOne mini-apps can access the microphone when you grant permission.

win:
  target:
    - nsis

linux:
  # electron-builder derives executableName from package.json `name`
  # (@superone/desktop), which sanitizes to an invalid `@superonedesktop`
  # and fails AppImage path validation on 26.15+. Pin it explicitly.
  executableName: superone
  target:
    - AppImage
  category: Development
