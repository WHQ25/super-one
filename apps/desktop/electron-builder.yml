appId: com.superone.app
productName: SuperOne
directories:
  output: dist

files:
  - out/**/*
  - "!node_modules/@img/sharp-*"
  # P5: do not ship managed harness platform binaries (~500MB+). Runtimes
  # install on demand via Settings → Harnesses (R2/npm tarball).
  - "!node_modules/@anthropic-ai/claude-agent-sdk-darwin-*/**"
  - "!node_modules/@anthropic-ai/claude-agent-sdk-linux-*/**"
  - "!node_modules/@anthropic-ai/claude-agent-sdk-win32-*/**"
  - "!node_modules/@openai/codex-darwin-*/**"
  - "!node_modules/@openai/codex-linux-*/**"
  - "!node_modules/@openai/codex-win32-*/**"

extraResources:
  - from: build/icon.png
    to: icon.png

afterPack: "./build/afterPack.cjs"

asarUnpack:
  # Native addons only — harness CLIs are no longer unpacked into the app.
  - "**/*.node"

publish:
  provider: generic
  url: https://dl.super-one.dev

mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  extendInfo:
    NSCameraUsageDescription: SuperOne mini-apps can access the camera when you grant permission.
    NSMicrophoneUsageDescription: SuperOne mini-apps can access the microphone when you grant permission.

win:
  target:
    - nsis

linux:
  target:
    - AppImage
  category: Development
