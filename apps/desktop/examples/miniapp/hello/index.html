<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Hello</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; padding: 24px; background: #fafaf9; color: #1c1917; }
    .dark body { background: #1c1917; color: #fafaf9; }
    h1 { font-size: 20px; margin-bottom: 16px; }
    #messages { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
    .msg { background: #fff; border: 1px solid #e7e5e4; border-radius: 8px; padding: 12px; }
    .dark .msg { background: #292524; border-color: #44403c; }
    button { background: #f97316; color: #fff; border: none; border-radius: 6px; padding: 8px 16px; cursor: pointer; font-size: 14px; }
    button:hover { background: #ea580c; }
    #files { margin-top: 16px; font-size: 13px; color: #78716c; white-space: pre-wrap; }
    .tooltip-target { display: inline-block; padding: 6px 12px; background: #e7e5e4; border-radius: 6px; font-size: 13px; cursor: default; }
    .dark .tooltip-target { background: #44403c; }
    #mic-status, #cam-status { font-size: 13px; color: #78716c; }
    #mic-status.live, #cam-status.live { color: #c62828; }
    #mic-status.live::before, #cam-status.live::before { content: '● '; animation: blink 1.4s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1 } 50% { opacity: 0.3 } }
    #mic-player { width: 100%; margin-top: 8px; }
    #dropzone { border: 2px dashed #d6d3d1; border-radius: 8px; padding: 24px; text-align: center; color: #78716c; transition: background .15s, border-color .15s, color .15s; }
    .dark #dropzone { border-color: #57534e; }
    #dropzone.drag-over { border-color: #f97316; background: rgba(249,115,22,0.08); color: #c2410c; }
    #drop-list { margin-top: 8px; font-size: 13px; color: #78716c; word-break: break-all; }
  </style>
</head>
<body>
  <h1>Hello Mini-App</h1>
  <div id="messages"><p style="color:#a8a29e">Waiting for agent messages...</p></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button id="ask-btn">Ask Agent to Greet</button>
    <button id="ask-buy-btn">Ask Agent to Buy (HITL)</button>
  </div>
  <div id="system-api" style="margin-top:20px">
    <h2 style="font-size:16px;margin-bottom:8px">System APIs</h2>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button id="btn-folder">Open Folder</button>
      <button id="btn-link">Open Link</button>
      <button id="btn-copy">Copy Text</button>
      <button id="btn-paste">Read Clipboard</button>
    </div>
    <div id="api-result" style="margin-top:8px;font-size:13px;color:#78716c"></div>
  </div>
  <div id="drop-api" style="margin-top:20px">
    <h2 style="font-size:16px;margin-bottom:8px">File Drop</h2>
    <div id="dropzone">Drop files here to save into <code>uploads/</code></div>
    <div id="drop-list">(empty)</div>
  </div>
  <div id="ui-api" style="margin-top:20px">
    <h2 style="font-size:16px;margin-bottom:8px">UI Overlay APIs</h2>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <button id="btn-toast-success">Toast Success</button>
      <button id="btn-toast-error">Toast Error</button>
      <button id="btn-toast-warning">Toast Warning</button>
      <span id="tooltip-target" class="tooltip-target">Hover me for tooltip</span>
      <span id="contextmenu-target" class="tooltip-target">Right-click me for menu</span>
      <button id="btn-popover">Open Popover</button>
    </div>
    <div id="ui-result" style="margin-top:8px;font-size:13px;color:#78716c"></div>
  </div>
  <div id="locale-api" style="margin-top:20px">
    <h2 style="font-size:16px;margin-bottom:8px">Locale</h2>
    <div id="locale-greeting" style="font-size:14px">—</div>
    <div id="locale-current" style="margin-top:4px;font-size:13px;color:#78716c"></div>
  </div>
  <div id="media-api" style="margin-top:20px">
    <h2 style="font-size:16px;margin-bottom:8px">Media APIs</h2>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px">
      <select id="mic-device" style="font-size:12px;padding:4px 6px;max-width:240px"></select>
      <button id="btn-mic-start">Start Mic</button>
      <button id="btn-mic-stop" disabled>Stop</button>
      <span id="mic-status">Idle</span>
    </div>
    <audio id="mic-player" controls></audio>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px">
      <select id="cam-device" style="font-size:12px;padding:4px 6px;max-width:240px"></select>
      <button id="btn-cam-start">Start Camera</button>
      <button id="btn-cam-snap" disabled>Take Photo</button>
      <button id="btn-cam-stop" disabled>Stop</button>
      <span id="cam-status">Idle</span>
    </div>
    <video id="cam-preview" autoplay playsinline muted style="width:100%;margin-top:8px;background:#000;border-radius:6px"></video>
    <canvas id="cam-snapshot" style="width:100%;margin-top:8px;border-radius:6px;display:none"></canvas>
  </div>
  <div id="db-api" style="margin-top:20px">
    <h2 style="font-size:16px;margin-bottom:8px">DB API</h2>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <input id="note-input" type="text" placeholder="Type a note..." style="flex:1;min-width:200px;padding:6px 10px;border:1px solid #d6d3d1;border-radius:6px;font-size:13px" />
      <button id="btn-note-add">Add Note</button>
      <button id="btn-note-clear">Clear All</button>
    </div>
    <div id="note-list" style="margin-top:8px;font-size:13px;color:#78716c">(no notes)</div>
  </div>
  <div id="context-api" style="margin-top:20px">
    <h2 style="font-size:16px;margin-bottom:8px">Context APIs</h2>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button id="btn-ctx-inject">Set Context (inject)</button>
      <button id="btn-ctx-suggest">Set Context (suggest)</button>
      <button id="btn-ctx-clear">Clear Context</button>
    </div>
    <div id="ctx-result" style="margin-top:8px;font-size:13px;color:#78716c"></div>
  </div>
  <div id="files"></div>
  <script>
    superone.tools.handle('show_message', function(args) {
      var container = document.getElementById('messages');
      if (container.querySelector('p')) container.innerHTML = '';
      var div = document.createElement('div');
      div.className = 'msg';
      div.textContent = args.text;
      container.appendChild(div);
      return { success: true, displayed: args.text };
    });

    superone.tools.handle('confirm_purchase', function(args) {
      var container = document.getElementById('messages');
      if (container.querySelector('p')) container.innerHTML = '';
      var div = document.createElement('div');
      div.className = 'msg';
      div.textContent = 'Purchase placed: item=' + args.item_id + ' qty=' + args.final_qty + ' payment=' + args.payment;
      container.appendChild(div);
      var orderId = 'ord_' + Math.random().toString(36).slice(2, 8);
      return {
        order_id: orderId,
        item_id: args.item_id,
        qty: args.final_qty,
        payment: args.payment,
        summary: orderId + ' · ' + args.final_qty + ' × ' + args.item_id + ' (' + args.payment + ')',
      };
    });

    superone.fs.readDir('.').then(function(entries) {
      document.getElementById('files').textContent = 'Files: ' + entries.map(function(e) { return e.name; }).join(', ');
    }).catch(function() {});

    document.getElementById('ask-btn').onclick = function() {
      superone.agent.sendPrompt('Say hello using the hello__show_message tool');
    };
    document.getElementById('ask-buy-btn').onclick = function() {
      superone.agent.sendPrompt('Use the hello__confirm_purchase tool with item_id="sku-001" and suggested_qty=2 to place an order. The user will confirm the quantity and payment method in the popup.');
    };

    var apiResult = document.getElementById('api-result');
    document.getElementById('btn-folder').onclick = function() {
      superone.openFolder('.');
      apiResult.textContent = 'Opening project folder in Finder...';
    };
    document.getElementById('btn-link').onclick = function() {
      superone.openExternalLink('https://github.com');
      apiResult.textContent = 'Opening GitHub in browser...';
    };
    document.getElementById('btn-copy').onclick = function() {
      superone.clipboard.write('Hello from SuperOne miniapp!');
      apiResult.textContent = 'Copied "Hello from SuperOne miniapp!" to clipboard';
    };
    document.getElementById('btn-paste').onclick = function() {
      superone.clipboard.read().then(function(text) {
        apiResult.textContent = 'Clipboard: ' + text;
      }).catch(function(err) {
        apiResult.textContent = 'Error: ' + err.message;
      });
    };

    var uiResult = document.getElementById('ui-result');

    document.getElementById('btn-toast-success').onclick = function() {
      superone.ui.toast('Operation completed successfully!', 'success');
    };
    document.getElementById('btn-toast-error').onclick = function() {
      superone.ui.toast('Something went wrong.', 'error');
    };
    document.getElementById('btn-toast-warning').onclick = function() {
      superone.ui.toast('Careful, this is a warning.', 'warning');
    };

    var tooltipTarget = document.getElementById('tooltip-target');
    tooltipTarget.onmouseenter = function() {
      var rect = tooltipTarget.getBoundingClientRect();
      superone.ui.showTooltip(
        { x: rect.left, y: rect.top, width: rect.width, height: rect.height },
        'This is a tooltip from the mini-app!',
        'top'
      );
    };
    tooltipTarget.onmouseleave = function() {
      superone.ui.hideTooltip();
    };

    var popoverBtn = document.getElementById('btn-popover');
    popoverBtn.onclick = function() {
      var rect = popoverBtn.getBoundingClientRect();
      var handle = superone.ui.showPopover({
        template: 'detail',
        data: { id: '42', title: 'Hello Popover', description: 'This popover template has full superone API access.' },
        anchorRect: { x: rect.left, y: rect.top, width: rect.width, height: rect.height },
        side: 'bottom',
        align: 'start',
        width: 320
      });
      handle.onMessage(function(msg) {
        uiResult.textContent = 'Popover message: ' + JSON.stringify(msg);
        if (msg.action === 'confirm') {
          handle.postMessage({ reply: 'confirmed', ts: Date.now() });
        }
      });
      handle.onClose(function() {
        uiResult.textContent = 'Popover closed';
      });
    };

    var L10N = {
      en: { greeting: 'Hello from SuperOne!', current: 'Current locale:' },
      zh: { greeting: '你好，SuperOne！', current: '当前语言：' }
    };
    function renderLocale() {
      var lang = superone.locale.get();
      var dict = L10N[lang] || L10N.en;
      document.getElementById('locale-greeting').textContent = dict.greeting;
      document.getElementById('locale-current').textContent = dict.current + ' ' + lang;
    }
    renderLocale();
    superone.locale.onChange(renderLocale);

    var ctxResult = document.getElementById('ctx-result');
    document.getElementById('btn-ctx-inject').onclick = function() {
      superone.agent.setContext({
        summary: '3 project files',
        content: 'src/index.ts — main entry point\nsrc/utils.ts — utility helpers\nsrc/config.ts — configuration',
        mode: 'inject',
        color: '#4a7fbf'
      });
      ctxResult.textContent = 'Set inject-mode context (blue chip)';
    };
    document.getElementById('btn-ctx-suggest').onclick = function() {
      superone.agent.setContext({
        summary: 'meeting notes',
        content: 'Action items:\n1. Review PR #42\n2. Update docs\n3. Deploy staging',
        mode: 'suggest',
        color: '#4a9a6a'
      });
      ctxResult.textContent = 'Set suggest-mode context (green chip, needs opt-in)';
    };
    document.getElementById('btn-ctx-clear').onclick = function() {
      superone.agent.clearContext();
      ctxResult.textContent = 'Context cleared';
    };
    var consumedCount = 0;
    superone.agent.onContextConsumed(function() {
      consumedCount++;
      ctxResult.textContent = 'Context consumed by message (#' + consumedCount + ')';
    });

    var micSelect = document.getElementById('mic-device');
    var camSelect = document.getElementById('cam-device');

    function fillSelect(selectEl, devices, fallbackLabel) {
      var prev = selectEl.value;
      selectEl.innerHTML = '';
      var defaultOpt = document.createElement('option');
      defaultOpt.value = '';
      defaultOpt.textContent = devices.length === 0 ? fallbackLabel : 'Default';
      selectEl.appendChild(defaultOpt);
      devices.forEach(function(d, i) {
        var opt = document.createElement('option');
        opt.value = d.deviceId;
        opt.textContent = d.label || (fallbackLabel + ' ' + (i + 1));
        selectEl.appendChild(opt);
      });
      if (prev) {
        for (var i = 0; i < selectEl.options.length; i++) {
          if (selectEl.options[i].value === prev) { selectEl.value = prev; break; }
        }
      }
    }

    function refreshDevices() {
      navigator.mediaDevices.enumerateDevices().then(function(list) {
        fillSelect(micSelect, list.filter(function(d) { return d.kind === 'audioinput'; }), 'Microphone');
        fillSelect(camSelect, list.filter(function(d) { return d.kind === 'videoinput'; }), 'Camera');
      });
    }
    refreshDevices();
    navigator.mediaDevices.addEventListener('devicechange', refreshDevices);

    var micStartBtn = document.getElementById('btn-mic-start');
    var micStopBtn = document.getElementById('btn-mic-stop');
    var micStatus = document.getElementById('mic-status');
    var micPlayer = document.getElementById('mic-player');
    var micRecorder = null;
    var micStream = null;
    var micChunks = [];
    micStartBtn.onclick = function() {
      var deviceId = micSelect.value;
      var audio = deviceId ? { deviceId: { exact: deviceId } } : true;
      navigator.mediaDevices.getUserMedia({ audio: audio }).then(function(stream) {
        micStream = stream;
        micChunks = [];
        micRecorder = new MediaRecorder(stream);
        micRecorder.ondataavailable = function(e) { if (e.data.size > 0) micChunks.push(e.data); };
        micRecorder.onstop = function() {
          var blob = new Blob(micChunks, { type: 'audio/webm' });
          micPlayer.src = URL.createObjectURL(blob);
          micStatus.textContent = 'Stopped (' + Math.round(blob.size / 1024) + ' KB)';
          micStatus.classList.remove('live');
        };
        micRecorder.start();
        micStatus.textContent = 'Recording';
        micStatus.classList.add('live');
        micStartBtn.disabled = true;
        micStopBtn.disabled = false;
        refreshDevices();
      }).catch(function(err) {
        micStatus.textContent = 'Mic denied: ' + (err && err.message ? err.message : err);
      });
    };
    micStopBtn.onclick = function() {
      if (micRecorder && micRecorder.state !== 'inactive') micRecorder.stop();
      if (micStream) micStream.getTracks().forEach(function(t) { t.stop(); });
      micStartBtn.disabled = false;
      micStopBtn.disabled = true;
    };

    var camStartBtn = document.getElementById('btn-cam-start');
    var camSnapBtn = document.getElementById('btn-cam-snap');
    var camStopBtn = document.getElementById('btn-cam-stop');
    var camStatus = document.getElementById('cam-status');
    var camPreview = document.getElementById('cam-preview');
    var camCanvas = document.getElementById('cam-snapshot');
    var camStream = null;
    camStartBtn.onclick = function() {
      var deviceId = camSelect.value;
      var video = deviceId ? { deviceId: { exact: deviceId } } : true;
      navigator.mediaDevices.getUserMedia({ video: video }).then(function(stream) {
        camStream = stream;
        camPreview.srcObject = stream;
        camStatus.textContent = 'Live';
        camStatus.classList.add('live');
        camStartBtn.disabled = true;
        camSnapBtn.disabled = false;
        camStopBtn.disabled = false;
        refreshDevices();
      }).catch(function(err) {
        camStatus.textContent = 'Camera denied: ' + (err && err.message ? err.message : err);
      });
    };
    camSnapBtn.onclick = function() {
      if (!camStream) return;
      var w = camPreview.videoWidth || 640;
      var h = camPreview.videoHeight || 480;
      camCanvas.width = w;
      camCanvas.height = h;
      camCanvas.style.display = 'block';
      camCanvas.getContext('2d').drawImage(camPreview, 0, 0, w, h);
      camStatus.textContent = 'Live · snapshot taken (' + w + '×' + h + ')';
    };
    camStopBtn.onclick = function() {
      if (camStream) camStream.getTracks().forEach(function(t) { t.stop(); });
      camPreview.srcObject = null;
      camStatus.textContent = 'Stopped';
      camStatus.classList.remove('live');
      camStartBtn.disabled = false;
      camSnapBtn.disabled = true;
      camStopBtn.disabled = true;
    };

    var dropzone = document.getElementById('dropzone');
    var dropList = document.getElementById('drop-list');

    function refreshDropList() {
      superone.fs.exists('uploads').then(function(ok) {
        if (!ok) { dropList.textContent = '(empty)'; return; }
        superone.fs.readDir('uploads').then(function(entries) {
          var files = entries.filter(function(e) { return !e.isDir; }).map(function(e) { return e.name; });
          dropList.textContent = files.length === 0 ? '(empty)' : 'uploads/: ' + files.join(', ');
        });
      });
    }

    ['dragenter', 'dragover'].forEach(function(ev) {
      dropzone.addEventListener(ev, function(e) {
        e.preventDefault();
        dropzone.classList.add('drag-over');
      });
    });
    ['dragleave', 'drop'].forEach(function(ev) {
      dropzone.addEventListener(ev, function(e) {
        e.preventDefault();
        dropzone.classList.remove('drag-over');
      });
    });

    dropzone.addEventListener('drop', function(e) {
      e.preventDefault();
      var files = Array.prototype.slice.call(e.dataTransfer.files || []);
      if (files.length === 0) return;
      Promise.all(files.map(function(file) {
        return file.arrayBuffer().then(function(buf) {
          return superone.fs.writeFile('uploads/' + file.name, buf)
            .then(function() { return { ok: true, name: file.name, size: buf.byteLength }; })
            .catch(function(err) { return { ok: false, name: file.name, error: err && err.message || String(err) }; });
        });
      })).then(function(results) {
        var saved = results.filter(function(r) { return r.ok; });
        var failed = results.filter(function(r) { return !r.ok; });
        if (saved.length > 0) {
          var kb = saved.reduce(function(s, r) { return s + r.size; }, 0) / 1024;
          superone.ui.toast('Saved ' + saved.length + ' file(s) · ' + kb.toFixed(1) + ' KB', 'success');
        }
        if (failed.length > 0) {
          superone.ui.toast('Failed: ' + failed.map(function(r) { return r.name + ' (' + r.error + ')'; }).join(', '), 'error');
        }
        refreshDropList();
      });
    });

    refreshDropList();

    var noteInput = document.getElementById('note-input');
    var noteList = document.getElementById('note-list');

    function refreshNotes() {
      superone.db.query('SELECT id, content, created_at FROM notes ORDER BY id DESC LIMIT 20').then(function(rows) {
        if (rows.length === 0) { noteList.textContent = '(no notes)'; return; }
        noteList.innerHTML = rows.map(function(r) {
          return '#' + r.id + ' · ' + new Date(r.created_at).toLocaleTimeString() + ' — ' + r.content;
        }).join('<br>');
      }).catch(function(err) {
        noteList.textContent = 'Error: ' + err.message;
      });
    }

    superone.db.exec(
      'CREATE TABLE IF NOT EXISTS notes (id INTEGER PRIMARY KEY, content TEXT NOT NULL, created_at INTEGER NOT NULL)'
    ).then(refreshNotes).catch(function(err) {
      noteList.textContent = 'DB unavailable: ' + err.message;
    });

    document.getElementById('btn-note-add').onclick = function() {
      var text = noteInput.value.trim();
      if (!text) return;
      superone.db.exec('INSERT INTO notes (content, created_at) VALUES (?, ?)', [text, Date.now()])
        .then(function(r) {
          noteInput.value = '';
          superone.ui.toast('Saved note #' + r.lastInsertRowid, 'success');
          refreshNotes();
        }).catch(function(err) { superone.ui.toast(err.message, 'error'); });
    };

    document.getElementById('btn-note-clear').onclick = function() {
      superone.db.exec('DELETE FROM notes').then(function(r) {
        superone.ui.toast('Cleared ' + r.changes + ' note(s)', 'info');
        refreshNotes();
      }).catch(function(err) { superone.ui.toast(err.message, 'error'); });
    };

    document.getElementById('contextmenu-target').oncontextmenu = function(e) {
      e.preventDefault();
      superone.ui.showContextMenu(
        { x: e.clientX, y: e.clientY },
        [
          { id: 'edit', label: 'Edit', icon: 'pencil', group: 'Actions' },
          { id: 'duplicate', label: 'Duplicate', icon: 'copy', group: 'Actions' },
          { id: 'move', label: 'Move to...', icon: 'folder-input', group: 'Actions' },
          { id: 'sep1', label: '', separator: true },
          { id: 'share', label: 'Share', icon: 'share-2', group: 'More' },
          { id: 'export', label: 'Export', icon: 'download', group: 'More' },
          { id: 'sep2', label: '', separator: true },
          { id: 'delete', label: 'Delete', icon: 'trash-2', variant: 'destructive' }
        ]
      ).then(function(itemId) {
        if (itemId) {
          uiResult.textContent = 'Context menu selected: ' + itemId;
        } else {
          uiResult.textContent = 'Context menu dismissed';
        }
      });
    };
  </script>
</body>
</html>
