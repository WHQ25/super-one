<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Confirm Purchase</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; padding: 12px; background: #fafaf9; color: #1c1917; font-size: 13px; }
    @media (prefers-color-scheme: dark) { body { background: #1c1917; color: #fafaf9; } }
    .row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    label { min-width: 90px; color: #78716c; }
    input, select { flex: 1; padding: 6px 8px; border: 1px solid #d6d3d1; border-radius: 4px; background: inherit; color: inherit; font: inherit; }
    .actions { display: flex; gap: 8px; margin-top: 10px; }
    button { flex: 1; padding: 7px 12px; border: none; border-radius: 4px; font: inherit; cursor: pointer; }
    .primary { background: #f97316; color: #fff; }
    .primary:hover { background: #ea580c; }
    .secondary { background: transparent; color: #78716c; border: 1px solid #d6d3d1; }
    .item-id { font-family: ui-monospace, monospace; padding: 2px 6px; background: rgba(0,0,0,0.06); border-radius: 3px; }
  </style>
</head>
<body>
  <div class="row">
    <label>Item</label>
    <span class="item-id" id="item"></span>
  </div>
  <div class="row">
    <label>Quantity</label>
    <input type="number" id="qty" min="1" step="1">
  </div>
  <div class="row">
    <label>Payment</label>
    <select id="payment">
      <option value="alipay">Alipay</option>
      <option value="wechat">WeChat Pay</option>
      <option value="card">Credit Card</option>
    </select>
  </div>
  <div class="actions">
    <button class="secondary" id="cancel">Cancel</button>
    <button class="primary" id="confirm">Confirm</button>
  </div>
  <script>
    var agent = superone.tool.data || {};
    document.getElementById('item').textContent = agent.item_id || '(unknown)';
    document.getElementById('qty').value = agent.suggested_qty || 1;

    document.getElementById('confirm').onclick = function() {
      var qty = parseInt(document.getElementById('qty').value, 10) || 1;
      var payment = document.getElementById('payment').value;
      superone.tool.submit({ final_qty: qty, payment: payment });
    };
    document.getElementById('cancel').onclick = function() {
      superone.tool.cancel('user_cancelled');
    };
  </script>
</body>
</html>
