<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; padding: 16px; background: var(--popover, #fff); color: var(--popover-foreground, #1c1917); }
    .dark body { background: #292524; color: #fafaf9; }
    h3 { font-size: 14px; margin-bottom: 8px; font-weight: 600; }
    p { font-size: 13px; color: #78716c; margin-bottom: 12px; }
    .actions { display: flex; gap: 8px; }
    button { font-size: 13px; padding: 6px 12px; border-radius: 6px; cursor: pointer; border: 1px solid #e7e5e4; background: #fff; color: #1c1917; }
    .dark button { border-color: #44403c; background: #44403c; color: #fafaf9; }
    button:hover { background: #f5f5f4; }
    .dark button:hover { background: #57534e; }
    button.primary { background: #f97316; color: #fff; border: none; }
    button.primary:hover { background: #ea580c; }
    button.danger { color: #ef4444; border-color: #fca5a5; }
    button.danger:hover { background: #fef2f2; }
    .dark button.danger { border-color: #991b1b; }
    .dark button.danger:hover { background: #450a0a; }
    #counter { font-size: 13px; color: #a8a29e; margin-top: 12px; }
  </style>
</head>
<body>
  <h3 id="title"></h3>
  <p id="desc"></p>
  <div class="actions">
    <button class="primary" id="btn-confirm">Confirm</button>
    <button class="danger" id="btn-delete">Delete</button>
    <button id="btn-toast">Toast from Popover</button>
    <button id="btn-close">Close</button>
  </div>
  <div id="counter">Messages received: 0</div>
  <script>
    var data = superone.popover.data || {}
    document.getElementById('title').textContent = data.title || 'Detail'
    document.getElementById('desc').textContent = data.description || 'No description'

    var count = 0
    superone.popover.onMessage(function(msg) {
      count++
      document.getElementById('counter').textContent = 'Messages received: ' + count + ' (last: ' + JSON.stringify(msg) + ')'
    })

    document.getElementById('btn-confirm').onclick = function() {
      superone.popover.postMessage({ action: 'confirm', id: data.id })
    }

    document.getElementById('btn-delete').onclick = function() {
      superone.popover.postMessage({ action: 'delete', id: data.id })
      superone.popover.close()
    }

    document.getElementById('btn-toast').onclick = function() {
      superone.ui.toast('Toast from popover!', 'success')
    }

    document.getElementById('btn-close').onclick = function() {
      superone.popover.close()
    }
  </script>
</body>
</html>
