<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tool</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 12px 14px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: 12px;
    line-height: 1.5;
    color: #1d1d1f;
    background: transparent;
  }
  @media (prefers-color-scheme: dark) {
    body { color: #f0f0f0; }
  }
  header {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px;
    color: rgba(127,127,127,0.85);
    margin-bottom: 6px;
  }
  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(127,127,127,0.5);
  }
  .dot.busy { background: #d97706; animation: pulse 1.2s infinite; }
  .dot.ok { background: #16a34a; }
  .dot.err { background: #dc2626; }
  .name { font-weight: 500; color: rgba(127,127,127,1); }
  @keyframes pulse { 0%,100%{opacity:.4} 50%{opacity:1} }
  .skel {
    display: flex; flex-direction: column; gap: 4px;
  }
  .bar {
    height: 8px; border-radius: 4px;
    background: linear-gradient(90deg,
      rgba(127,127,127,.10) 0%,
      rgba(127,127,127,.18) 50%,
      rgba(127,127,127,.10) 100%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
  }
  .bar.short { width: 30%; }
  .bar.med { width: 60%; }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  pre {
    margin: 0;
    padding: 8px 10px;
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
    font-size: 11px;
    line-height: 1.5;
    background: rgba(127,127,127,0.06);
    border-radius: 6px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .err { color: #dc2626; }
</style>
</head>
<body>
  <header>
    <span class="dot busy" id="dot"></span>
    <span class="name" id="name">tool</span>
  </header>
  <div class="skel" id="skel">
    <div class="bar med"></div>
    <div class="bar short"></div>
  </div>
  <pre id="result" hidden></pre>
  <pre id="err" class="err" hidden></pre>

  <script type="module">
    const KEY = 'counter'

    superone.tools.handle('read_counter', async () => {
      const value = (await superone.kv.get(KEY)) ?? 0
      return { value }
    })

    superone.tools.handle('reset', async () => {
      await superone.kv.set(KEY, 0)
      superone.peer.emit('count-changed', { value: 0, delta: 0, reset: true, at: Date.now() })
      return { ok: true, value: 0 }
    })

    document.getElementById('name').textContent = superone.tool.toolName

    const dot = document.getElementById('dot')
    const skel = document.getElementById('skel')
    const resultEl = document.getElementById('result')
    const errEl = document.getElementById('err')

    function render(detail) {
      skel.hidden = true
      if (detail.error) {
        dot.className = 'dot err'
        errEl.hidden = false
        errEl.textContent = String(detail.error)
      } else {
        dot.className = 'dot ok'
        resultEl.hidden = false
        try { resultEl.textContent = JSON.stringify(detail.result, null, 2) }
        catch { resultEl.textContent = String(detail.result) }
      }
      requestAnimationFrame(() => {
        const h = document.documentElement.scrollHeight
        if (window.parent) window.parent.postMessage({ type: 'miniapp-resize', height: h }, '*')
      })
    }
    window.addEventListener('superone:tool-result', (ev) => render(ev.detail))
    const t = window.superone && window.superone.tool
    if (t && (t.result !== null || t.error !== null)) {
      render({ result: t.result, error: t.error })
    }
  </script>
</body>
</html>
