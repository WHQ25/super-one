appId: ${APP_ID}
name: Composer suggestion overlays cover every reachable state
tags: [smoke, native, visual]
---
# Maestro matches a row's whole accessibility label, and each row composes into
# one element — `/clear, Clear the conversation and start over`, not `/clear`.
# That is deliberate: a row that announces its name, argument hint and
# description separately reads as three unrelated items under VoiceOver.
- runFlow:
    file: ../helpers/open-shell-preview.yaml
- tapOn: "Preview page:.*"
- tapOn: "Composer suggestions"
- extendedWaitUntil:
    visible:
      id: composer-suggestions-gallery
    timeout: 15000

# Slash rows run through the shipping matcher, so these assert the real
# grouping — not a fixture of what the grouping ought to be.
- assertVisible: "Slash · bare /"
- assertVisible: "Commands"
- assertVisible: "Skills"
- assertVisible: "/clear, Clear the conversation and start over"
- assertVisible: "/add-dir.*Give the session another project directory"
# A command with no description renders as the bare name.
- assertVisible: "/resume"
- takeScreenshot: ${"composer-suggestions-slash-" + THEME}

# `/rel` scores the `release` skill above every command. Desktop leads with the
# better-scoring group; mobile always leads with Commands. This section is what
# makes that gap visible, so it is expected to show Commands first *today*.
- scrollUntilVisible:
    element:
      text: "Slash · /rel"
    direction: DOWN
    # A heading at the very bottom leaves its list below the fold.
    centerElement: true
- assertVisible: "/create-release-notes, Draft release notes from the commit range"
- assertVisible: "/release.*Version bump.*"

# A skill-only query must drop the Commands header entirely rather than render
# an empty group.
- scrollUntilVisible:
    element:
      text: "Slash · /tdd"
    direction: DOWN
    # A heading at the very bottom leaves its list below the fold.
    centerElement: true
- assertVisible: "/tdd, Test-driven development workflow"

# There is deliberately no slash empty state today: the overlay unmounts. The
# caption is the only thing left on screen for that section.
- scrollUntilVisible:
    element:
      text: "Slash · multi-line draft"
    direction: DOWN
    # A heading at the very bottom leaves its list below the fold.
    centerElement: true
# The first line is the query; the rest is message body.
- assertVisible: "/review, Review the current diff for correctness and cleanups"

- scrollUntilVisible:
    element:
      text: "Slash · no match"
    direction: DOWN
    # A heading at the very bottom leaves its list below the fold.
    centerElement: true
- assertVisible: "Renders nothing at all. There is no empty state for a settled catalog."
- takeScreenshot: ${"composer-suggestions-ranking-" + THEME}

# A catalog that has not answered yet must never render as an empty list — that
# is indistinguishable from "this harness has no commands".
- scrollUntilVisible:
    element:
      text: "Slash · catalog loading"
    direction: DOWN
    # A heading at the very bottom leaves its list below the fold.
    centerElement: true
- assertVisible: "Loading commands…"
- scrollUntilVisible:
    element:
      text: "Slash · catalog failed"
    direction: DOWN
    # A heading at the very bottom leaves its list below the fold.
    centerElement: true
- assertVisible: "Could not load commands"
- scrollUntilVisible:
    element:
      text: "Slash · dismissable"
    direction: DOWN
    # A heading at the very bottom leaves its list below the fold.
    centerElement: true
- assertVisible: "Hide commands"
- takeScreenshot: ${"composer-suggestions-catalog-" + THEME}

# Each suggestion list clips at 256 px, so only the first group of a full list
# is on screen. Group *order* is asserted in the component test, which does not
# clip; here the sections are split by query so every row is reviewable.
- scrollUntilVisible:
    element:
      text: "Mention · bare @"
    direction: DOWN
    # A heading at the very bottom leaves its list below the fold.
    centerElement: true
- assertVisible: "Built-in"
# Every capability is listed; a switched-off one says where to switch it on
# instead of disappearing. That hint is the only second line any mention row
# has — every other kind is a single line, as on the desktop.
- assertVisible: "Computer Use.*Enable Computer Use in the desktop settings.*Off"
- takeScreenshot: ${"composer-suggestions-mention-" + THEME}

- scrollUntilVisible:
    element:
      text: "Mention · @co"
    direction: DOWN
    # A heading at the very bottom leaves its list below the fold.
    centerElement: true
# Collaborators rank by slug, and they are their own group — not merged with
# the project agents below them.
- assertVisible: "Collaborators"
# Name and slug on one line; the provider ref the tag carries is not shown.
- assertVisible: "Codex.*@codex"

- scrollUntilVisible:
    element:
      text: "Mention · @safari"
    direction: DOWN
    # A heading at the very bottom leaves its list below the fold.
    centerElement: true
- assertVisible: "Desktop Apps"

- scrollUntilVisible:
    element:
      text: "Mention · @comp"
    direction: DOWN
    # A heading at the very bottom leaves its list below the fold.
    centerElement: true
- assertVisible: "Files"
- takeScreenshot: ${"composer-suggestions-groups-" + THEME}

- scrollUntilVisible:
    element:
      text: "Mention · search failed"
    direction: DOWN
    # A heading at the very bottom leaves its list below the fold.
    centerElement: true
- assertVisible: "Could not reach the desktop"
- assertVisible: "Retry search"
- scrollUntilVisible:
    element:
      text: "Mention · no matches"
    direction: DOWN
    # A heading at the very bottom leaves its list below the fold.
    centerElement: true
- assertVisible: "No matches"
- takeScreenshot: ${"composer-suggestions-states-" + THEME}

# Directory browsing. A phone has no Tab and no Backspace-to-parent, so the
# trail is the only way back out of a nested folder — its absence at the root
# and its presence below are both load-bearing.
- scrollUntilVisible:
    element:
      text: "Mention · browsing the root"
    direction: DOWN
    # Stopping the moment the heading appears leaves its list below the fold.
    centerElement: true
- assertVisible: "apps"
- assertVisible: "package.json"
- takeScreenshot: ${"composer-suggestions-browse-root-" + THEME}

- scrollUntilVisible:
    element:
      text: "Mention · inside src/ui"
    direction: DOWN
    # Stopping the moment the heading appears leaves its list below the fold.
    centerElement: true
# Inside a directory the query is a path, so only Files is left. That the
# capability rows drop out is asserted in the component test — every section of
# this gallery stays mounted, so a negative assertion here would read the
# sections above.
- assertVisible: "Files"
- assertVisible: "Browse project root"
- assertVisible: "Browse src"
# The directory being listed is not somewhere to go.
- assertNotVisible: "Browse ui"
# Tapping a folder opens it; mentioning the folder itself needs its own target.
- assertVisible: "Mention theme"
- takeScreenshot: ${"composer-suggestions-browse-nested-" + THEME}

- scrollUntilVisible:
    element:
      text: "Mention · scoped search.*"
    direction: DOWN
    # Stopping the moment the heading appears leaves its list below the fold.
    centerElement: true
# Scoped rows show the path minus the directory already typed — one line, no
# repeat of the prefix underneath.
- assertVisible: "composer-suggestions.tsx"
- assertVisible: "Browse src"
- takeScreenshot: ${"composer-suggestions-browse-scoped-" + THEME}

# The `@session` portal. Its three phases each answer a different question, so
# each has its own empty state — a single "No matches" would be a lie in two of
# them.
- scrollUntilVisible:
    element:
      text: "Mention · @session scope"
    direction: DOWN
    centerElement: true
- assertVisible: "Project scope"
- assertVisible: "All Projects, all projects"
- assertVisible: "super-one, current project"

- scrollUntilVisible:
    element:
      text: "Mention · @session recent"
    direction: DOWN
    centerElement: true
- assertVisible: "Sessions"
- assertVisible: "Align the mention popup with desktop.*super-one.*claude"
# A session with no title yet still has to be selectable, so it shows its id.
- assertVisible: "sess-0c4d.*relay.*claude"
- assertVisible: "Load more"
- takeScreenshot: ${"composer-suggestions-session-portal-" + THEME}

- scrollUntilVisible:
    element:
      text: "Mention · @session no matches"
    direction: DOWN
    centerElement: true
- assertVisible: "No matching sessions"

# `/mcp` opens a surface instead of writing into the draft. It is read-only:
# the desktop popup can reconnect and sign in, and a phone that cannot finish
# an OAuth flow must not offer to start one.
- scrollUntilVisible:
    element:
      text: "Command · /mcp"
    direction: DOWN
    centerElement: true
- tapOn: "Open MCP panel: servers"
- extendedWaitUntil:
    visible:
      id: mcp-panel
    timeout: 10000
# The panel scrolls at 256 px like every other composer layer, so this asserts
# the rows a user sees first. Which line each status produces is pinned in
# `mcp-status.test.ts`; what matters here is that it opens inline, above the
# composer, with the draft and the keyboard still there.
# Opening it grows the section, so bring the panel itself into view — the
# gallery is one long scroll and the toggles sit above it.
- scrollUntilVisible:
    element:
      text: "postgres"
    direction: DOWN
    centerElement: true
# Not "failed" — the reason is the useful half.
- assertVisible: "spawn postgres-mcp ENOENT"
- assertVisible: "Needs sign-in on the desktop"
- takeScreenshot: ${"composer-mcp-panel-" + THEME}
- tapOn: "Close MCP servers"

- tapOn: "Open MCP panel: empty"
- extendedWaitUntil:
    visible:
      id: mcp-panel
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "This session has no MCP servers configured."
    direction: DOWN
    centerElement: true
- tapOn: "Close MCP servers"

# `/workflows` is the other command that opens a surface. It reads the
# transcript, so it needs no host round trip — and it is read-only: starting a
# workflow spends tokens and is a different question.
- scrollUntilVisible:
    element:
      text: "Command · /workflows"
    direction: DOWN
    centerElement: true
- tapOn: "Open workflows panel: runs"
- extendedWaitUntil:
    visible:
      id: workflows-panel
    timeout: 10000
# Newest first: the one still in question leads.
- scrollUntilVisible:
    element:
      text: "migrate-tokens"
    direction: DOWN
    centerElement: true
- assertVisible: "Running"
- assertVisible: "review-changes"
- assertVisible: "Finished"
- assertVisible: "Audit → Rewrite → Verify"
- takeScreenshot: ${"composer-workflows-panel-" + THEME}
- tapOn: "Close Workflows"

- tapOn: "Open workflows panel: empty"
- extendedWaitUntil:
    visible:
      id: workflows-panel
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "No workflows in this session yet"
    direction: DOWN
    centerElement: true
- tapOn: "Close Workflows"
