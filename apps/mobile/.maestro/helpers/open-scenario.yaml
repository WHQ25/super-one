appId: ${APP_ID}
---
- runFlow:
    when:
      visible: "Close preview"
    commands:
      - tapOn: "Close preview"
- runFlow:
    when:
      notVisible:
        id: prompt-title
    commands:
      - extendedWaitUntil:
          visible:
            id: native-preview-ready
          timeout: 60000
- openLink:
    autoVerify: true
    link: ${"superone://native-preview?scenario=" + SCENARIO + "&theme=" + THEME + "&harness=claude"}
- repeat:
    times: 3
    commands:
      - runFlow:
          when:
            visible: 'Open in.*'
          commands:
            - tapOn: 'Open'
- extendedWaitUntil:
    visible:
      id: prompt-title
    timeout: 15000
