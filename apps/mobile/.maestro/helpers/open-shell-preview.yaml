appId: ${APP_ID}
---
# The runner opens the development client through a deep link, and iOS asks to
# confirm the first one. Clear it before looking for the preview.
- repeat:
    times: 3
    commands:
      - runFlow:
          when:
            visible: 'Open in.*'
          commands:
            - tapOn: 'Open'
- runFlow:
    when:
      visible: "Close preview"
    commands:
      - tapOn: "Close preview"
- runFlow:
    when:
      visible:
        id: prompt-reject
    commands:
      - tapOn:
          id: prompt-reject
- extendedWaitUntil:
    visible:
      id: native-preview-ready
    timeout: 60000
- tapOn: ${THEME}
- tapOn: "Preview app screens"
- extendedWaitUntil:
    visible:
      id: phone-composer
    timeout: 15000
