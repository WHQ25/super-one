plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.qrscanner'
version = '0.1.0'

configurations.configureEach {
  resolutionStrategy.force 'com.google.guava:listenablefuture:1.0'
}

android {
  namespace 'expo.modules.qrscanner'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
    consumerProguardFiles 'proguard-rules.pro'
  }
}

dependencies {
  def camerax_version = '1.6.0'
  def wechat_qrcode_version = '2.6.0'

  implementation 'androidx.appcompat:appcompat:1.7.1'
  implementation 'androidx.core:core-ktx:1.18.0'
  implementation 'androidx.exifinterface:exifinterface:1.4.2'
  implementation "androidx.camera:camera-core:${camerax_version}"
  implementation "androidx.camera:camera-camera2:${camerax_version}"
  implementation "androidx.camera:camera-lifecycle:${camerax_version}"
  implementation "androidx.camera:camera-view:${camerax_version}"

  implementation "com.github.jenly1314.WeChatQRCode:opencv:${wechat_qrcode_version}"
  implementation "com.github.jenly1314.WeChatQRCode:opencv-armv64:${wechat_qrcode_version}"
  implementation "com.github.jenly1314.WeChatQRCode:opencv-armv7a:${wechat_qrcode_version}"
  implementation "com.github.jenly1314.WeChatQRCode:opencv-x86_64:${wechat_qrcode_version}"
  implementation "com.github.jenly1314.WeChatQRCode:wechat-qrcode:${wechat_qrcode_version}"

  testImplementation 'junit:junit:4.13.2'
}
