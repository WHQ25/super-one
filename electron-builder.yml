appId: com.superone.app
productName: SuperOne
directories:
  output: dist

files:
  - out/**/*
  - "!node_modules/@anthropic-ai/claude-agent-sdk/vendor/ripgrep/x64-linux"
  - "!node_modules/@anthropic-ai/claude-agent-sdk/vendor/ripgrep/arm64-linux"
  - "!node_modules/@anthropic-ai/claude-agent-sdk/vendor/ripgrep/x64-win32"

asarUnpack:
  - "**/*.node"
  - "node_modules/@anthropic-ai/claude-agent-sdk/cli.js"
  - "node_modules/@anthropic-ai/claude-agent-sdk/vendor/**"

publish:
  provider: github

mac:
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  x64ArchFiles: "**/app.asar.unpacked/**"
  category: public.app-category.developer-tools
  # hardenedRuntime: true
  # entitlements: build/entitlements.mac.plist
  # entitlementsInherit: build/entitlements.mac.plist

win:
  target:
    - target: nsis
      arch: [x64, arm64]

linux:
  target:
    - target: AppImage
      arch: [x64, arm64]
  category: Development
