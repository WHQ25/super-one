appId: com.superone.app
productName: SuperOne
directories:
  output: dist

files:
  - out/**/*
  - "!node_modules/@anthropic-ai/claude-agent-sdk/vendor/ripgrep/x64-linux"
  - "!node_modules/@anthropic-ai/claude-agent-sdk/vendor/ripgrep/arm64-linux"
  - "!node_modules/@anthropic-ai/claude-agent-sdk/vendor/ripgrep/x64-win32"
  - "!node_modules/@anthropic-ai/claude-agent-sdk/vendor/ripgrep/arm64-win32"
  - "!node_modules/@anthropic-ai/claude-agent-sdk/vendor/audio-capture/x64-linux"
  - "!node_modules/@anthropic-ai/claude-agent-sdk/vendor/audio-capture/arm64-linux"
  - "!node_modules/@anthropic-ai/claude-agent-sdk/vendor/audio-capture/x64-win32"
  - "!node_modules/@anthropic-ai/claude-agent-sdk/vendor/audio-capture/arm64-win32"
  - "!node_modules/@img/sharp-*"

asarUnpack:
  - "**/*.node"
  - "node_modules/@anthropic-ai/claude-agent-sdk/cli.js"
  - "node_modules/@anthropic-ai/claude-agent-sdk/vendor/**"
  - "node_modules/@openai/codex*/**"

publish:
  provider: github
  private: true

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  category: public.app-category.developer-tools
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true

win:
  target:
    - target: nsis
      arch: [x64, arm64]

linux:
  target:
    - target: AppImage
      arch: [x64, arm64]
  category: Development
