appId: com.superone.app
productName: SuperOne
directories:
  output: dist

files:
  - out/**/*
  - "!node_modules/@anthropic-ai/claude-agent-sdk/vendor/ripgrep/x64-linux"
  - "!node_modules/@anthropic-ai/claude-agent-sdk/vendor/ripgrep/arm64-linux"
  - "!node_modules/@anthropic-ai/claude-agent-sdk/vendor/ripgrep/x64-win32"

asarUnpack:
  - "**/*.node"
  - "node_modules/@anthropic-ai/claude-agent-sdk/cli.js"
  - "node_modules/@anthropic-ai/claude-agent-sdk/vendor/**"
  - "node_modules/@openai/codex/**"
  - "node_modules/@openai/codex-darwin-arm64/**"
  - "node_modules/@openai/codex-darwin-x64/**"
  - "node_modules/@openai/codex-linux-x64/**"
  - "node_modules/@openai/codex-linux-arm64/**"
  - "node_modules/@openai/codex-win32-x64/**"
  - "node_modules/@openai/codex-win32-arm64/**"

publish:
  provider: github
  private: true

mac:
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  x64ArchFiles: "**/app.asar.unpacked/**"
  category: public.app-category.developer-tools
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true

win:
  target:
    - target: nsis
      arch: [x64, arm64]

linux:
  target:
    - target: AppImage
      arch: [x64, arm64]
  category: Development
