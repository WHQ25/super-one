<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Frames in the transcript (widgets) are srcdoc documents, which this does not block.
         It stops a frame from navigating itself to a new document: Android WebView never asks
         the native navigation hook about an https sub-frame navigation. -->
    <meta http-equiv="Content-Security-Policy" content="frame-src 'none'" />
    <!-- maximum-scale: WebKit zooms the page onto a focused field under 16px (the question form); a pinch still zooms. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>SuperOne chat</title>
    <style>
      :root { --brand-hue: 250; color-scheme: dark; }
      html, body, #root { margin: 0; height: 100%; background: #111; color: #f4f4f5; font: 16px/1.45 system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
